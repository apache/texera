yarnPath: .yarn/releases/yarn-4.5.1.cjs
nodeLinker: node-modules
nmMode: hardlinks-local

# Strip transitive `jschardet` (LGPL-2.1, ASF Category X) declared by
# `@codingame/monaco-vscode-api`. It is only referenced by a dynamic
# `await import('jschardet')` inside the VS Code textfile encoding service,
# a code path Texera never exercises. Removing the declaration keeps it
# out of yarn.lock, node_modules, and the production bundle. See #4461.
packageExtensions:
  "@codingame/monaco-vscode-api@*":
    dependencies:
      jschardet: null
