<ng-template #modalTitle>
  <div class="email-modal-title">
    <span>One more thing</span>
    <img
      src="assets/logos/full_logo_small.png"
      alt="Texera logo"
      class="email-modal-logo" />
  </div>
</ng-template>

<p>
  You are signed in as <strong>{{ name }}</strong>. This account has no email address on file, and Texera uses yours to
  identify you when datasets are shared with you.
</p>

<label style="display: block">Email</label>
<input
  class="email-modal-input"
  nz-input
  [(ngModel)]="email"
  [attr.readonly]="step === 'code' ? '' : null"
  type="email"
  placeholder="you@university.edu" />

<!-- The code is bound to the address it was mailed to, so the address is frozen once it is sent. -->
@if (step === "code") {
<label class="email-modal-code-label"> Enter the code sent to <strong>{{ email }}</strong> </label>
<input
  class="email-modal-input"
  nz-input
  [(ngModel)]="code"
  inputmode="numeric"
  autocomplete="one-time-code"
  maxlength="6"
  placeholder="000000" />
}
