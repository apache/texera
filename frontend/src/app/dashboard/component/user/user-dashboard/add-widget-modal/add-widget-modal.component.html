<div class="add-widget-modal">
  <header class="modal-header">
    <h3>Add Widgets</h3>
    <p class="hint">
      Check the widgets you want to add and fill in the data. You can add multiple at once,
      and keep the modal open to add another batch.
    </p>
  </header>

  <!-- Quick metric presets -->
  <section class="quick-presets">
    <span class="presets-label">Quick:</span>
    <button
      *ngFor="let p of metricPresets"
      class="preset-chip"
      [style.--chip-color]="p.color"
      (click)="applyMetricPreset(p)">
      {{ p.label }}
    </button>
  </section>

  <!-- Widget gallery with inline forms -->
  <section class="widget-list">
    <!-- METRIC -->
    <article class="widget-row" [class.enabled]="metric.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="metric.enabled">
          <span nz-icon nzType="field-number" class="row-icon"></span>
          <span class="row-name">Metric Card</span>
          <span class="row-sub">One big number — e.g. accuracy, F1.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="metric.enabled">
        <label>Title<input nz-input [(ngModel)]="metric.config.title" /></label>
        <label>Value<input nz-input [(ngModel)]="metric.config.value" /></label>
        <label>Caption<input nz-input [(ngModel)]="metric.config.caption" /></label>
        <label>Color<input nz-input [(ngModel)]="metric.config.color" /></label>
      </div>
    </article>

    <!-- BAR -->
    <article class="widget-row" [class.enabled]="bar.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="bar.enabled">
          <span nz-icon nzType="bar-chart" class="row-icon"></span>
          <span class="row-name">Bar Chart</span>
          <span class="row-sub">Compare models or groups across one or more metrics.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="bar.enabled">
        <label>Title<input nz-input [(ngModel)]="bar.config.title" /></label>
        <label>Categories (comma-separated)
          <input nz-input [(ngModel)]="bar.raw!['categoriesRaw']" />
        </label>
        <label>
          Series — one per line: <code>name | color | v1, v2, v3</code>
          <textarea nz-input rows="3" [(ngModel)]="bar.raw!['seriesRaw']"></textarea>
        </label>
      </div>
    </article>

    <!-- HBAR -->
    <article class="widget-row" [class.enabled]="hbar.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="hbar.enabled">
          <span nz-icon nzType="menu" class="row-icon"></span>
          <span class="row-name">Horizontal Bars</span>
          <span class="row-sub">Ranked items — great for feature importance.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="hbar.enabled">
        <label>Title<input nz-input [(ngModel)]="hbar.config.title" /></label>
        <label>
          Items — one per line: <code>label | value</code>
          <textarea nz-input rows="4" [(ngModel)]="hbar.raw!['itemsRaw']"></textarea>
        </label>
        <label>Bar color<input nz-input [(ngModel)]="hbar.config.color" /></label>
      </div>
    </article>

    <!-- DONUT -->
    <article class="widget-row" [class.enabled]="donut.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="donut.enabled">
          <span nz-icon nzType="pie-chart" class="row-icon"></span>
          <span class="row-name">Donut Chart</span>
          <span class="row-sub">Proportions — class balance, breakdowns.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="donut.enabled">
        <label>Title<input nz-input [(ngModel)]="donut.config.title" /></label>
        <label>
          Segments — one per line: <code>label | value | color</code>
          <textarea nz-input rows="3" [(ngModel)]="donut.raw!['segmentsRaw']"></textarea>
        </label>
        <label>Center label<input nz-input [(ngModel)]="donut.config.centerLabel" /></label>
      </div>
    </article>

    <!-- TABLE -->
    <article class="widget-row" [class.enabled]="table.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="table.enabled">
          <span nz-icon nzType="table" class="row-icon"></span>
          <span class="row-name">Table</span>
          <span class="row-sub">Full metrics table.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="table.enabled">
        <label>Title<input nz-input [(ngModel)]="table.config.title" /></label>
        <label>Columns (comma-separated)
          <input nz-input [(ngModel)]="table.raw!['columnsRaw']" />
        </label>
        <label>
          Rows — one per line, cells comma-separated
          <textarea nz-input rows="4" [(ngModel)]="table.raw!['rowsRaw']"></textarea>
        </label>
      </div>
    </article>

    <!-- TEXT -->
    <article class="widget-row" [class.enabled]="text.enabled">
      <header class="row-header">
        <label nz-checkbox [(ngModel)]="text.enabled">
          <span nz-icon nzType="file-text" class="row-icon"></span>
          <span class="row-name">Text / Notes</span>
          <span class="row-sub">Key findings, callouts, takeaways.</span>
        </label>
      </header>
      <div class="row-form" *ngIf="text.enabled">
        <label>Title<input nz-input [(ngModel)]="text.config.title" /></label>
        <label>Body
          <textarea
            nz-input
            rows="5"
            [(ngModel)]="text.config.body"
            placeholder="Free-form notes — newlines preserved."></textarea>
        </label>
      </div>
    </article>
  </section>

  <footer class="modal-footer">
    <div class="footer-status">
      <span *ngIf="addedCount > 0" class="added-count" [class.flash]="justAddedFlash">
        <span nz-icon nzType="check-circle"></span>
        Added {{ addedCount }} widget{{ addedCount === 1 ? '' : 's' }} so far
      </span>
    </div>
    <div class="footer-actions">
      <button nz-button (click)="cancel()">Cancel</button>
      <button nz-button (click)="done()">Done</button>
      <button
        nz-button
        nzType="primary"
        [disabled]="selectedCount === 0"
        (click)="addSelected()">
        <span nz-icon nzType="plus"></span>
        Add {{ selectedCount > 0 ? selectedCount : '' }}
        {{ selectedCount === 1 ? 'widget' : 'widgets' }}
      </button>
    </div>
  </footer>
</div>
