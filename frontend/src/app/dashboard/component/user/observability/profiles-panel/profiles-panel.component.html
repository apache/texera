<form [formGroup]="form" class="profiles-panel">
  <div class="row">
    <nz-range-picker
      [nzShowTime]="true"
      [nzAllowClear]="false"
      formControlName="range"></nz-range-picker>
    <input
      nz-input
      type="number"
      formControlName="workflowId"
      placeholder="Workflow id (optional)" />
    <input
      nz-input
      type="number"
      formControlName="executionId"
      placeholder="Execution id (optional)" />
    <button
      nz-button
      nzType="primary"
      type="button"
      [disabled]="loading || form.invalid"
      (click)="refresh()">
      Refresh
    </button>
  </div>

  <nz-alert
    *ngIf="errorMessage"
    nzType="error"
    [nzMessage]="errorMessage"
    nzShowIcon></nz-alert>
</form>

<div class="result">
  <p *ngIf="root" class="summary">Total samples: {{ totalSamples }}</p>

  <texera-flame-chart *ngIf="root; else noSamples" [root]="root"></texera-flame-chart>

  <ng-template #noSamples>
    <nz-empty
      *ngIf="!loading && !errorMessage"
      nzNotFoundContent="No CPU samples for the selected window. The Parca eBPF agent may not be running on this host, or the workflow has only just started. On non-Linux dev machines, set TEXERA_OBSERVABILITY_PROFILES=disabled in .env."></nz-empty>
  </ng-template>
</div>
