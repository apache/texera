<form
  [formGroup]="form"
  class="traces-panel">
  <div class="row">
    <input
      nz-input
      type="text"
      formControlName="traceId"
      placeholder="Trace id (32 lowercase hex chars)"
      maxlength="32" />
    <button
      nz-button
      nzType="primary"
      type="button"
      [disabled]="loading || form.invalid"
      (click)="fetch()">
      Open
    </button>
  </div>

  <nz-alert
    *ngIf="errorMessage"
    nzType="error"
    [nzMessage]="errorMessage"
    nzShowIcon></nz-alert>
</form>

<div
  class="tree"
  *ngIf="trace; else noTrace">
  <p class="trace-header">Trace <span class="mono">{{ trace.traceId }}</span> — {{ trace.spans.length }} span(s)</p>

  <ng-container *ngTemplateOutlet="nodeTpl; context: { nodes: spanTree, depth: 0 }"> </ng-container>

  <ng-template
    #nodeTpl
    let-nodes="nodes"
    let-depth="depth">
    <ul class="span-list">
      <li
        *ngFor="let n of nodes"
        class="span-row"
        [style.paddingLeft.px]="depth * 16">
        <!--
          Span name is bound via {{ }} interpolation only — never
          via [innerHTML]. The gateway has redacted it, but the
          renderer must stay trustworthy too.
        -->
        <span class="span-name">{{ n.span.name }}</span>
        <span class="duration">{{ n.durationMs }} ms</span>
        <ul
          class="attrs"
          *ngIf="n.span.attributes && (n.span.attributes | keyvalue)?.length">
          <li *ngFor="let attr of n.span.attributes | keyvalue">
            <span class="attr-key">{{ attr.key }}</span>
            <span class="attr-val">{{ attr.value }}</span>
          </li>
        </ul>
        <ng-container *ngTemplateOutlet="nodeTpl; context: { nodes: n.children, depth: depth + 1 }"> </ng-container>
      </li>
    </ul>
  </ng-template>
</div>

<ng-template #noTrace>
  <nz-empty
    *ngIf="!errorMessage && !loading"
    nzNotFoundContent="Paste a trace id above to view the span tree. Trace ids appear in log rows as a clickable button — clicking it pivots here."></nz-empty>
</ng-template>
