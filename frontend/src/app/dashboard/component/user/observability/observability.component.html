<div class="texera-observability">
  <div class="header">
    <h2>Observability</h2>
    <nz-alert
      *ngIf="healthError"
      nzType="warning"
      nzMessage="Observability gateway not reachable. Backend services may be disabled."
      nzShowIcon></nz-alert>
  </div>

  <nz-tabs [(nzSelectedIndex)]="activeTab">
    <!-- Per-signal panels are added by their respective PRs (obs/pr15-18);
         the shell ships the tab framework + health gating first. -->
    <nz-tab nzTitle="Logs">
      <texera-observability-logs-panel *ngIf="isReachable('logs'); else logsDisabled"></texera-observability-logs-panel>
      <ng-template #logsDisabled>
        <nz-empty
          nzNotFoundContent="VictoriaLogs is unreachable or disabled. Enable the observability-logs profile in docker-compose."></nz-empty>
      </ng-template>
    </nz-tab>

    <nz-tab nzTitle="Metrics">
      <texera-observability-metrics-panel
        *ngIf="isReachable('metrics'); else metricsDisabled"></texera-observability-metrics-panel>
      <ng-template #metricsDisabled>
        <nz-empty
          nzNotFoundContent="VictoriaMetrics is unreachable or disabled. Enable the observability-metrics profile in docker-compose."></nz-empty>
      </ng-template>
    </nz-tab>

    <nz-tab nzTitle="Traces">
      <texera-observability-traces-panel
        *ngIf="isReachable('traces'); else tracesDisabled"
        [initialTraceId]="pivotedTraceId"></texera-observability-traces-panel>
      <ng-template #tracesDisabled>
        <nz-empty
          nzNotFoundContent="Jaeger is unreachable or disabled. Enable the observability-traces profile in docker-compose."></nz-empty>
      </ng-template>
    </nz-tab>

    <nz-tab nzTitle="Profiles">
      <nz-empty nzNotFoundContent="Profiles panel coming soon."></nz-empty>
    </nz-tab>
  </nz-tabs>
</div>
