<div class="section-container subsection-grid-container">
  <nz-card class="section-title">
    <h2 class="page-title">Workflows</h2>
    <div class="button-group">
      <button
        nz-button
        class="create-btn"
        (click)="onClickCreateNewWorkflowFromDashboard()"
        title="Create a new workflow">
        <i
          nz-icon
          nzType="file-add"
          nzTheme="outline"></i>
        <span>Create Workflow</span>
      </button>
      <nz-space-compact
        class="utility-button-group"
        ngbDropdown>
        <texera-sort-button (sortMethodChange)="sortMethod = $event; search()"></texera-sort-button>
        <nz-upload [nzBeforeUpload]="onClickUploadExistingWorkflowFromLocal">
          <button
            nz-button
            title="Upload ZIP/JSON file as workflow"
            nz-tooltip="Upload ZIP/JSON file as workflow"
            nzTooltipPlacement="bottom"
            type="button">
            <i
              nz-icon
              nzType="cloud-upload"
              nzTheme="outline"></i>
          </button>
        </nz-upload>
        <button
          *ngIf="pythonNotebookMigrationEnabled"
          [disabled]="accessLevel === 'READ'"
          nz-button
          (click)="openAiGenerateModal()"
          title="AI generate a workflow from a Python notebook"
          nz-tooltip="AI generate a workflow from a Python notebook"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzType="robot"
            nzTheme="outline"></i>
        </button>
        <button
          *ngIf="multiWorkflowsOperationButtonEnabled()"
          (click)="toggleSelection()"
          nz-button
          nzType="default"
          [nz-tooltip]="selectionTooltip"
          nzTooltipPlacement="bottom"
          title="Batch Select"
          type="button">
          <i
            nz-icon
            nzType="select"
            nzTheme="outline"></i>
        </button>
        <button
          *ngIf="multiWorkflowsOperationButtonEnabled()"
          (click)="onClickOpenDownloadZip()"
          nz-button
          title="Download added workflow as a ZIP file"
          nz-tooltip="Download added workflow as a ZIP file"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzType="cloud-download"
            nzTheme="outline"></i>
        </button>
        <button
          *ngIf="multiWorkflowsOperationButtonEnabled()"
          (click)="onClickDuplicateSelectedWorkflows()"
          nz-button
          nz-tooltip="Duplicate selected workflows"
          nzTooltipPlacement="bottom"
          type="button">
          <i
            nz-icon
            nzTheme="outline"
            nzType="copy"></i>
        </button>
        <button
          *ngIf="multiWorkflowsOperationButtonEnabled()"
          nz-popconfirm
          nzPopconfirmTitle="Confirm to delete selected workflows."
          nz-button
          nz-tooltip="Delete selected workflows"
          (nzOnConfirm)="handleConfirmDeleteSelectedWorkflows()"
          nzTooltipPlacement="bottom">
          <i
            nz-icon
            nzTheme="outline"
            nzType="delete"></i>
        </button>
        <button
          nz-button
          title="List View"
          (click)="setViewType('list')"
          [nzType]="viewType === 'list' ? 'primary' : 'default'">
          <i
            nz-icon
            nzType="bars"
            nzTheme="outline"></i>
        </button>
        <button
          nz-button
          title="Card View"
          (click)="setViewType('card')"
          [nzType]="viewType === 'card' ? 'primary' : 'default'">
          <i
            nz-icon
            nzType="appstore"
            nzTheme="outline"></i>
        </button>
      </nz-space-compact>
      <texera-filters #filters></texera-filters>
    </div>
  </nz-card>

  <div class="section-search-bar workflow-search-bar">
    <texera-filters-instructions></texera-filters-instructions>
    <nz-select
      class="search-input-box"
      name="search-input-box"
      nzMode="tags"
      nzPlaceHolder="Search all workflows"
      nzVariant="borderless"
      [nzOpen]="false"
      ngDefaultControl
      [(ngModel)]="filters.masterFilterList"
      [nzAllowClear]="true">
    </nz-select>
  </div>

  <ng-template
    #workflowCardTpl
    let-entry>
    <texera-card-item
      class="workflow-card-item"
      [entry]="entry"
      [currentUid]="currentUid"
      [isPrivateSearch]="true"
      [editable]="true"
      (deleted)="deleteWorkflow(entry)"
      (duplicated)="onClickDuplicateWorkflow(entry)"
      (refresh)="refreshSearchResult()"
      (checkboxChanged)="searchResultsComponent.onEntryCheckboxChange()">
    </texera-card-item>
  </ng-template>

  <texera-search-results
    [editable]="true"
    [isPrivateSearch]="true"
    [viewMode]="viewType"
    [cardTemplate]="workflowCardTpl"
    (deleted)="deleteWorkflow($event)"
    (refresh)="refreshSearchResult()"
    (duplicated)="onClickDuplicateWorkflow($event)"
    [currentUid]="currentUid"
    (notifyWorkflow)="updateTooltip()"></texera-search-results>
</div>
