<div class="genesis-build-modal">
  <div class="genesis-build-modal__header">
    <span class="genesis-build-modal__spinner" aria-hidden="true"></span>
    <span class="genesis-build-modal__title">Working</span>
    <span class="genesis-build-modal__dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </div>
  <p class="genesis-build-modal__intro">
    The Texera agent is composing your workflow — usually 20–30 seconds. Steps appear below as they finish.
  </p>
  <div class="genesis-build-modal__log">
    @for (line of progress.lines(); track $index; let last = $last) {
      <div class="genesis-build-modal__line" [class.is-latest]="last">{{ line }}</div>
    } @empty {
      <div class="genesis-build-modal__placeholder">Waiting for the first step…</div>
    }
  </div>
</div>
