<nz-space-compact
  class="filter-button-group"
  ngbDropdown>
  @for (date of dateDropdowns; track date.field) {
  <a
    [nzDropdownMenu]="dateMenu"
    nz-dropdown
    nzTrigger="click"
    [nzOverlayStyle]="{ 'border-style': 'double' }"
    [class]="date.cssClass">
    <button
      [id]="date.id"
      ngbDropdownToggle
      nz-button
      [title]="date.title">
      <i
        nz-icon
        [nzType]="date.icon"
        nzTheme="outline"></i>
    </button>
  </a>
  <nz-dropdown-menu #dateMenu="nzDropdownMenu">
    <nz-range-picker
      nzInline
      [ngModel]="date.field === 'mtime' ? selectedMtime : selectedCtime"
      (ngModelChange)="onDateRangeChange(date.field, $event)"
      ngDefaultControl></nz-range-picker>
  </nz-dropdown-menu>
  } @for (facet of facetDropdowns; track facet.field) { @if (facet.field === "owner" || (isLogin && hasIdFilter)) {
  <a
    [hidden]="!isLogin"
    [nzDropdownMenu]="facetMenu"
    nz-dropdown
    nzTrigger="click"
    [nzOverlayStyle]="{ 'overflow-y': 'scroll', 'max-height': '250px', 'border-style': 'double' }"
    [class]="facet.cssClass">
    <button
      [id]="facet.id"
      ngbDropdownToggle
      nz-button
      [title]="facet.title">
      <i
        nz-icon
        nzTheme="outline"
        [nzType]="facet.icon"></i>
    </button>
  </a>
  }
  <nz-dropdown-menu #facetMenu="nzDropdownMenu">
    @for (entry of facet.field === "owner" ? owners : wids; track entry) {
    <ul nz-menu>
      <li nz-menu-item>
        <label
          nz-checkbox
          ngDefaultControl
          [(ngModel)]="entry.checked"
          (ngModelChange)="facet.field === 'owner' ? updateSelectedOwners() : updateSelectedIDs()"
          >{{ facetEntryLabel(entry) }}</label
        >
      </li>
    </ul>
    }
  </nz-dropdown-menu>
  }

  <a
    [nzDropdownMenu]="operatorSearchOptions"
    nz-dropdown
    nzTrigger="click"
    [nzOverlayStyle]="{'border-style': 'double'}"
    class="search-operators-button">
    <button
      id="sortOperator"
      ngbDropdownToggle
      nz-button
      title="Operators">
      <i
        nz-icon
        nzType="appstore"
        nzTheme="outline"></i>
    </button>
  </a>
  <nz-dropdown-menu #operatorSearchOptions="nzDropdownMenu">
    <ul
      nz-menu
      *ngFor="let group of operatorGroups">
      <li
        nz-submenu
        nzTitle="{{group}}">
        <ul *ngFor="let operator of operators.get(group)">
          <li nz-menu-item>
            <label
              nz-checkbox
              ngDefaultControl
              [(ngModel)]="operator.checked"
              (ngModelChange)="updateSelectedOperators()"
              >{{operator.userFriendlyName}}</label
            >
          </li>
        </ul>
      </li>
    </ul>
  </nz-dropdown-menu>
</nz-space-compact>
