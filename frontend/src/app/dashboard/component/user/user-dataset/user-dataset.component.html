<div class="section-container subsection-grid-container">
  <nz-card class="section-title">
    <h2 class="page-title">Datasets</h2>
    <div class="button-group">
      <button
        nz-button
        class="create-btn"
        (click)="onClickOpenDatasetAddComponent()"
        title="Create Dataset">
        <i
          nz-icon
          nzType="file-add"
          nzTheme="outline"></i>
        <span>Create Dataset</span>
      </button>
      <texera-filters #filters></texera-filters>
    </div>
  </nz-card>

  <nz-card
    *ngIf="isLogin"
    class="import-sources-card"
    [nzBordered]="false">
    <div class="import-sources-row">
      <div class="import-source-block">
        <div class="import-source-title">
          <i
            nz-icon
            nzType="link"
            nzTheme="outline"></i>
          <span>Import from URL</span>
        </div>
        <div class="url-import-controls">
          <input
            type="text"
            placeholder="https://example.com/data.csv"
            [(ngModel)]="urlImportInput"
            [disabled]="isImporting"
            (keyup.enter)="onClickImportFromUrl()" />
          <button
            nz-button
            nzType="primary"
            [nzLoading]="isImporting"
            [disabled]="!urlImportInput || isImporting"
            (click)="onClickImportFromUrl()">
            Import
          </button>
        </div>
        <div class="import-source-hint">Paste any URL pointing to a CSV or JSON file.</div>
      </div>

      <div class="import-source-block">
        <div class="import-source-title">
          <i
            nz-icon
            nzType="inbox"
            nzTheme="outline"></i>
          <span>Import Local File</span>
        </div>
        <div
          class="drop-zone"
          [class.dragging]="isDragging"
          (click)="fileInput.click()"
          (dragenter)="onDragEnter($event)"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)">
          <div class="drop-zone-primary">
            Drag & drop .sqlite, .csv, .json, or .xlsx here
          </div>
          <div class="drop-zone-secondary">or click to browse</div>
        </div>
        <input
          #fileInput
          type="file"
          hidden
          accept=".sqlite,.db,.csv,.json,.xlsx"
          (change)="onFileSelected($event)" />
      </div>
    </div>
  </nz-card>

  <div class="section-search-bar">
    <texera-filters-instructions></texera-filters-instructions>
    <nz-select
      #searchInput
      class="search-input-box"
      name="search-input-box"
      nzMode="tags"
      nzPlaceHolder="Search all dataset"
      nzVariant="borderless"
      [nzOpen]="false"
      ngDefaultControl
      [(ngModel)]="filters.masterFilterList"
      [nzAllowClear]="true">
    </nz-select>
  </div>

  <texera-search-results
    [editable]="true"
    [isPrivateSearch]="true"
    (deleted)="deleteDataset($event)"
    (refresh)="ngAfterViewInit()"
    [currentUid]="currentUid"></texera-search-results>
</div>
