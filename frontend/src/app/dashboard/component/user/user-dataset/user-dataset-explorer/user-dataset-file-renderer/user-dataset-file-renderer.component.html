<div
  [ngStyle]="!isMaximized ? {'padding-top': '15px', 'margin-left': '30px', 'width': '95%', 'height': '80%', 'overflow-x': 'auto', 'overflow-y': 'auto'}:
                                {'padding-top': '15px', 'margin-left': '30px', 'width': '95%', 'height': '100%', 'overflow-x': 'auto', 'overflow-y': 'auto'}">
  <div class="file-display-area">
    <div *ngIf="isLoading">
      <nz-spin nzTip="Loading...">
        <nz-alert
          nzType="info"
          nzMessage="File content is loading"></nz-alert>
      </nz-spin>
    </div>
    <div *ngIf="isFileLoadingError">
      <nz-alert
        nzType="error"
        nzMessage="File loading encounter error."
        nzDescription="Ops, There is something wrong when loading the file you are requesting."></nz-alert>
    </div>
    <div *ngIf="isFileSizeUnloadable">
      <nz-alert
        nzType="warning"
        nzMessage="File is too large to preview"></nz-alert>
    </div>
    <div *ngIf="isFileTypePreviewUnsupported">
      <nz-alert
        nzType="warning"
        nzMessage="Preview of the file type is currently not supported"></nz-alert>
    </div>
    <div *ngIf="detectedTypeMessage">
      <nz-alert
        nzType="info"
        [nzMessage]="detectedTypeMessage"></nz-alert>
    </div>

    <div *ngIf="previewTruncated">
      <nz-alert
        nzType="warning"
        nzMessage="Showing first 10 MB only"
        nzDescription="This file is large; only the first 10 MB is parsed and rendered to avoid running the browser out of memory. Statistics shown reflect the previewed slice, not the whole file."
        nzShowIcon></nz-alert>
    </div>

    <div *ngIf="metadataItems.length > 0 || canOpenInWorkflow" class="file-metadata-strip">
      <span *ngFor="let item of metadataItems" class="metadata-pill">
        <span class="metadata-label">{{ item.label }}</span>
        <span class="metadata-value">{{ item.value }}</span>
      </span>
      <button
        *ngIf="canOpenInWorkflow"
        nz-button
        nzType="primary"
        nzSize="small"
        class="open-in-workflow-btn"
        (click)="onOpenInWorkflow()">
        <span nz-icon nzType="play-circle" nzTheme="outline"></span>
        Open in workflow
      </button>
    </div>

    <nz-table
      *ngIf="displayCSV || displayXlsx"
      #basicTable
      [nzData]="tableContent">
      <thead>
        <tr>
          <th *ngFor="let column of tableDataHeader; let i = index">
            <div class="column-name">{{ column }}</div>
            <div class="column-meta" *ngIf="fileMetadata?.columnTypes?.[i]">
              <span class="column-type-tag">{{ fileMetadata?.columnTypes?.[i] }}</span>
              <span
                class="column-null-hint"
                *ngIf="fileMetadata?.nullCounts?.[i] && fileMetadata!.nullCounts![i] > 0">
                {{ fileMetadata?.nullCounts?.[i] }} null
              </span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of basicTable.data">
          <td *ngFor="let cell of row">{{ cell }}</td>
        </tr>
      </tbody>
    </nz-table>

    <div *ngIf="displayImage && safeFileURL">
      <img
        [src]="safeFileURL"
        alt="{{filePath}}"
        (click)="toggleImageModal()"
        style="width: 50%; height: 70%; margin: auto" />
    </div>

    <!-- Full-size image modal -->
    <div
      *ngIf="showImageModal"
      class="image-modal"
      (click)="toggleImageModal()">
      <img
        [src]="safeFileURL"
        alt="{{filePath}}"
        class="full-size-image" />
    </div>

    <div *ngIf="displayPDF && safeResourceFileURL">
      <iframe
        [src]="safeResourceFileURL"
        style="width: 100%; height: 600px; border: none;">
      </iframe>
    </div>

    <div *ngIf="displayMarkdown">
      <markdown [data]="textContent"></markdown>
    </div>
    <div *ngIf="displayJson">
      <ngx-json-viewer [json]="textContent"></ngx-json-viewer>
    </div>
    <div *ngIf="displayMP4 && safeFileURL">
      <video
        controls
        [src]="safeFileURL">
        Your browser does not support the video tag.
      </video>
    </div>
    <div *ngIf="displayMP3 && safeFileURL">
      <audio
        controls
        [src]="safeFileURL">
        Your browser does not support the audio element.
      </audio>
    </div>
    <div *ngIf="displayPlainText">{{ textContent }}</div>
  </div>
</div>
