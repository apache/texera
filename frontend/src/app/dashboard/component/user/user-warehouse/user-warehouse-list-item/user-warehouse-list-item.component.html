<nz-card
  [nzBodyStyle]="{padding: '3px'}"
  class="warehouse-list-item-card">
  <div
    nz-row
    nzAlign="middle"
    class="warehouse-item-row">
    <div
      nz-col
      nzFlex="20px"></div>

    <div
      nz-col
      nzFlex="0"
      class="type-icon">
      <i
        nz-icon
        nzType="cloud-server"></i>
    </div>

    <div
      nz-col
      nzFlex="0"
      class="warehouse-id">
      <i>#{{ warehouse.whid }}</i>
    </div>

    <div
      nz-col
      nzFlex="1"
      class="resource-name-group">
      <div
        class="resource-name truncate-single-line"
        nz-tooltip
        [nzTooltipTitle]="warehouse.name"
        (click)="openWarehouseMetadataModal()">
        {{ warehouse.name }}
      </div>
    </div>

    <div class="button-group">
      <button
        nz-button
        nzType="text"
        title="Delete"
        (click)="deleted.emit()">
        <i
          nz-icon
          nzType="delete"></i>
      </button>
    </div>

    <div
      nz-col
      nzFlex="100px"
      class="resource-info">
      Created:<br />
      {{ formatRelativeTime(warehouse.createdAtMillis) }}
    </div>

    <div
      nz-col
      nzFlex="90px"
      class="resource-info">
      Flavor:<br />
      {{ warehouse.flavor }}
    </div>
  </div>
</nz-card>
