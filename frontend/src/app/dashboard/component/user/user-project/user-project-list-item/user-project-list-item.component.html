<a
  class="project-card"
  [routerLink]="ROUTER_USER_PROJECT_BASE_URL + '/' + entry.pid">
  <div
    class="project-icon"
    [ngStyle]="{ 'background-color': '#' + bgColorHex }">
    {{ icon }}
  </div>

  <div class="project-body">
    <div
      class="project-name"
      [innerHTML]="entry.name | highlightSearchTerms: keywords"></div>
    <div
      class="project-description"
      *ngIf="descriptionPreview">
      {{ descriptionPreview }}
    </div>
    <div class="project-stats">
      <span class="stat">📄 {{ workflowCount }} workflow{{ workflowCount === 1 ? '' : 's' }}</span>
      <span class="stat-sep">·</span>
      <span class="stat">📊 {{ datasetCount }} dataset{{ datasetCount === 1 ? '' : 's' }}</span>
      <span class="stat-sep">·</span>
      <span class="stat">👥 {{ memberCount }} member{{ memberCount === 1 ? '' : 's' }}</span>
    </div>
  </div>

  <div class="project-meta">
    <div class="updated-label">Updated {{ relativeUpdatedLabel }}</div>
    <div
      *ngIf="editable"
      class="project-actions"
      (click)="$event.stopPropagation(); $event.preventDefault()">
      <button
        nz-button
        nzType="text"
        nzSize="small"
        nz-tooltip="Delete project"
        nzTooltipPlacement="left"
        [disabled]="entry.accessLevel === 'READ'"
        nz-popconfirm
        nzPopconfirmTitle="Delete this project? Workflows inside will remain."
        (nzOnConfirm)="deleted.emit()">
        <i
          nz-icon
          nzTheme="outline"
          nzType="delete"></i>
      </button>
    </div>
  </div>
</a>
