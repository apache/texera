<div class="add-dataset-modal">
  <div
    *ngIf="unaddedDatasets.length > 0"
    class="search-row">
    <i
      nz-icon
      nzType="search"
      nzTheme="outline"
      class="search-icon"></i>
    <input
      type="search"
      class="search-input"
      placeholder="Search datasets…"
      [(ngModel)]="searchTerm" />
  </div>

  <div
    *ngIf="!loading && unaddedDatasets.length === 0"
    class="empty">
    <div class="empty-emoji">📊</div>
    <div class="empty-title">No datasets to add</div>
    <div class="empty-subtitle">All your accessible datasets are already in this project, or you don't have any yet.</div>
  </div>

  <div
    *ngIf="!loading && unaddedDatasets.length > 0 && filteredIndices.length === 0"
    class="empty">
    <div class="empty-emoji">🔍</div>
    <div class="empty-title">No matches</div>
    <div class="empty-subtitle">Try a different search.</div>
  </div>

  <div
    *ngIf="filteredIndices.length > 0"
    class="select-all-row">
    <label class="select-all">
      <input
        type="checkbox"
        [checked]="isAllChecked()"
        (change)="toggleAll()" />
      Select all ({{ filteredIndices.length }})
    </label>
  </div>

  <ul
    *ngIf="filteredIndices.length > 0"
    class="dataset-list">
    <li
      *ngFor="let i of filteredIndices"
      class="dataset-row"
      [class.selected]="checked[i]">
      <label class="dataset-label">
        <input
          type="checkbox"
          [(ngModel)]="checked[i]" />
        <span class="dataset-main">
          <span class="dataset-name">{{ unaddedDatasets[i].dataset.name }}</span>
          <span
            *ngIf="unaddedDatasets[i].dataset.description"
            class="dataset-desc">
            {{ unaddedDatasets[i].dataset.description }}
          </span>
          <span class="dataset-meta">
            <span>
              <i
                nz-icon
                nzType="hdd"
                nzTheme="outline"></i>
              {{ formatSize(unaddedDatasets[i].size) }}
            </span>
            <span class="dot">·</span>
            <span>{{ unaddedDatasets[i].dataset.creationTime | date: 'yyyy-MM-dd' }}</span>
            <span class="dot">·</span>
            <span>{{ unaddedDatasets[i].ownerEmail }}</span>
          </span>
        </span>
      </label>
    </li>
  </ul>

  <div class="dialog-actions">
    <button
      nz-button
      type="button"
      (click)="cancel()">
      Cancel
    </button>
    <button
      nz-button
      nzType="primary"
      type="button"
      [disabled]="!anyChecked()"
      (click)="confirm()">
      Add Selected
      <span
        *ngIf="anyChecked()"
        class="count-pill">
        {{ selectedCount() }}
      </span>
    </button>
  </div>
</div>
