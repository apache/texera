<div class="user-project-page">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Projects</h1>
      <p class="page-subtitle">Organize workflows, datasets, and members into projects</p>
    </div>
    <div class="header-actions">
      <a
        [nzDropdownMenu]="sortMenu"
        nz-dropdown>
        <button
          nz-button
          title="Sort">
          <i
            nz-icon
            nzTheme="outline"
            nzType="sort-ascending"></i>
        </button>
      </a>
      <nz-dropdown-menu #sortMenu="nzDropdownMenu">
        <ul
          nz-menu
          nzSelectable>
          <li
            (click)="sortByCreationTime()"
            nz-menu-item>
            By Time Created
          </li>
          <li
            (click)="sortByNameAsc()"
            nz-menu-item>
            A &rarr; Z
          </li>
          <li
            (click)="sortByNameDesc()"
            nz-menu-item>
            Z &rarr; A
          </li>
        </ul>
      </nz-dropdown-menu>
      <button
        (click)="openPublicProject()"
        nz-button
        nz-tooltip="Browse public projects"
        nzTooltipPlacement="bottom">
        <i
          nz-icon
          nzTheme="outline"
          nzType="appstore"></i>
        Public Projects
      </button>
      <button
        (click)="openCreateDialog()"
        nz-button
        nzType="primary">
        <i
          nz-icon
          nzTheme="outline"
          nzType="plus"></i>
        New Project
      </button>
    </div>
  </header>

  <section class="project-list">
    <div
      *ngIf="!loading && userProjectEntries.length === 0"
      class="empty-state">
      <div class="empty-emoji">📁</div>
      <h3>No projects yet</h3>
      <p>Create your first project to group related workflows, datasets, and collaborators.</p>
      <button
        nz-button
        nzType="primary"
        (click)="openCreateDialog()">
        <i
          nz-icon
          nzTheme="outline"
          nzType="plus"></i>
        Create your first project
      </button>
    </div>

    <texera-user-project-list-item
      *ngFor="let dashboardUserProjectEntry of userProjectEntries; trackBy: trackByPid"
      [editable]="true"
      [uid]="uid"
      [entry]="dashboardUserProjectEntry"
      (deleted)="deleteProject(dashboardUserProjectEntry.pid)"
      (refresh)="loadProjects()">
    </texera-user-project-list-item>
  </section>
</div>
