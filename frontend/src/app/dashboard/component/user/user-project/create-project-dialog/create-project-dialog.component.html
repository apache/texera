<div class="create-project-dialog">
  <div class="preview-row">
    <div
      class="icon-bubble"
      [ngStyle]="{ 'background-color': '#' + color }">
      {{ icon || '📁' }}
    </div>
    <div class="preview-text">
      <div class="preview-name">{{ name.trim() || (isEdit ? 'Untitled project' : 'New project') }}</div>
      <div
        class="preview-description"
        *ngIf="description.trim()">
        {{ description }}
      </div>
    </div>
  </div>

  <nz-form-item>
    <nz-form-label nzRequired>Icon</nz-form-label>
    <nz-form-control>
      <div class="icon-picker">
        <input
          nz-input
          class="icon-input"
          [(ngModel)]="icon"
          maxlength="4"
          placeholder="📁" />
        <div class="icon-suggestions">
          <button
            *ngFor="let emoji of suggestedIcons"
            class="icon-chip"
            [ngClass]="{ selected: icon === emoji }"
            (click)="selectIcon(emoji)"
            type="button">
            {{ emoji }}
          </button>
        </div>
      </div>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>Name</nz-form-label>
    <nz-form-control>
      <input
        nz-input
        [(ngModel)]="name"
        maxlength="128"
        placeholder="Project name" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Description</nz-form-label>
    <nz-form-control>
      <textarea
        nz-input
        rows="3"
        [(ngModel)]="description"
        maxlength="500"
        placeholder="What is this project about?"></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Color</nz-form-label>
    <nz-form-control>
      <div class="color-swatches">
        <button
          *ngFor="let preset of presetColors"
          type="button"
          class="color-swatch"
          [ngClass]="{ selected: color === preset }"
          [ngStyle]="{ 'background-color': '#' + preset }"
          (click)="selectColor(preset)"
          [attr.aria-label]="'Color ' + preset"></button>
      </div>
    </nz-form-control>
  </nz-form-item>

  <div class="dialog-actions">
    <button
      nz-button
      type="button"
      (click)="cancel()">
      Cancel
    </button>
    <button
      nz-button
      nzType="primary"
      type="button"
      [disabled]="!canSave"
      (click)="save()">
      {{ isEdit ? 'Save changes' : 'Create project' }}
    </button>
  </div>
</div>
