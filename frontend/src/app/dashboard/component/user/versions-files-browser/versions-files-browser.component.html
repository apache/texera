<div class="versions-tab-content">
  <nz-layout>
    <nz-content style="background-color: white">
      <nz-card>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div class="file-info">
            <h3 class="file-title">
              <span class="file-title-main">
                <b>{{ currentDisplayedFileName }}</b>

                <button
                  nz-button
                  nzType="text"
                  nzSize="small"
                  class="copy-path-btn"
                  nz-tooltip
                  nzTooltipTitle="Copy file path"
                  *ngIf="currentDisplayedFileName"
                  (click)="copyCurrentFilePath()">
                  <i
                    nz-icon
                    nzType="copy"
                    nzTheme="twotone">
                  </i>
                </button>
              </span>

              <span
                *ngIf="currentFileSize"
                class="file-size">
                <i
                  nz-icon
                  nzType="file"
                  nzTheme="outline"
                  class="icon-file"></i>
                {{ formatSize(currentFileSize) }}
              </span>
            </h3>
          </div>
          <div style="display: flex">
            <button
              nz-button
              *ngIf="selectedVersion"
              nz-tooltip="Download the file"
              [disabled]="!isLogin || !downloadAllowed"
              (click)="downloadCurrentFile.emit()">
              <i
                nz-icon
                nzTheme="outline"
                nzType="download">
              </i>
            </button>
            <button
              nz-button
              *ngIf="!isMaximized && selectedVersion"
              nz-tooltip="Maximize View"
              (click)="onClickScaleTheView()">
              <i
                nz-icon
                nzTheme="outline"
                nzType="expand">
              </i>
            </button>
            <button
              nz-button
              *ngIf="isMaximized && selectedVersion"
              nz-tooltip="Minimize View"
              (click)="onClickScaleTheView()">
              <i
                nz-icon
                nzTheme="outline"
                nzType="compress">
              </i>
            </button>
            <button
              *ngIf="!isRightBarCollapsed"
              nz-button
              nz-tooltip="Hide the right bar"
              (click)="onClickHideRightBar()">
              <i
                nz-icon
                nzTheme="outline"
                nzType="right">
              </i>
            </button>
            <button
              *ngIf="isRightBarCollapsed"
              nz-button
              nz-tooltip="Show Tree"
              (click)="onClickHideRightBar()">
              <i
                nz-icon
                nzTheme="outline"
                nzType="left">
              </i>
            </button>
          </div>
        </div>
      </nz-card>
      <nz-empty
        class="empty-version-indicator"
        *ngIf="!selectedVersion"
        [nzNotFoundContent]="emptyMessage"></nz-empty>

      <texera-user-dataset-file-renderer
        *ngIf="selectedVersion"
        [isMaximized]="isMaximized"
        [resourceType]="resourceType"
        [resourceId]="resourceId"
        [versionId]="versionId"
        [filePath]="currentDisplayedFileName"
        [fileSize]="currentFileSize"
        [isLogin]="isLogin"
        class="file-renderer">
      </texera-user-dataset-file-renderer>
    </nz-content>
    <nz-sider
      *ngIf="!isRightBarCollapsed"
      nzTheme="light"
      [nzWidth]="siderWidth"
      nz-resizable
      [nzMinWidth]="MIN_SIDER_WIDTH"
      [nzMaxWidth]="MAX_SIDER_WIDTH"
      (nzResize)="onSideResize($event)">
      <nz-resize-handle nzDirection="left">
        <div class="sider-resize-line">
          <i
            class="sider-resize-handle"
            nz-icon
            nzType="more"
            nzTheme="outline"></i>
        </div>
      </nz-resize-handle>
      <div class="right-sider">
        <nz-collapse nzGhost>
          <nz-collapse-panel
            nzHeader="Current Versions"
            nzActive="true">
            <div class="version-storage">
              <h6 style="font-weight: lighter; font-size: 0.9em">Choose a Version:</h6>
              <div class="select-and-button-container">
                <nz-select
                  nzShowSearch
                  nzPlaceHolder="Select a version"
                  [ngModel]="selectedVersion"
                  (ngModelChange)="versionSelected.emit($event)">
                  <nz-option
                    *ngFor="let version of versions"
                    [nzValue]="version"
                    [nzLabel]="version.name"></nz-option>
                </nz-select>
                <button
                  nz-button
                  [nz-tooltip]="downloadZipTooltip"
                  [attr.nz-tooltip]="downloadZipTooltip"
                  (click)="downloadVersionAsZip.emit()"
                  *ngIf="selectedVersion"
                  [disabled]="!isLogin || !downloadAllowed"
                  class="spaced-button">
                  <i
                    nz-icon
                    nzType="download"
                    nzTheme="outline"></i>
                </button>
              </div>
              <ng-container *ngIf="selectedVersion">
                <div class="version-size">
                  <i
                    nz-icon
                    nzType="database"
                    nzTheme="outline"
                    class="icon-database"></i>
                  Version Size: {{ formatSize(currentVersionSize) }}
                </div>
                <div
                  *ngIf="selectedVersionCreationTime"
                  class="version-date">
                  <i
                    nz-icon
                    nzType="calendar"
                    nzTheme="outline"
                    class="icon-database"></i>
                  Created at: {{ selectedVersionCreationTime }}
                </div>
              </ng-container>
            </div>
            <texera-user-dataset-version-filetree
              [fileTreeNodes]="fileTreeNodeList"
              [isTreeNodeDeletable]="writeAccess"
              [isCoverSettable]="writeAccess"
              (selectedTreeNode)="fileTreeNodeSelected.emit($event)"
              (deletedTreeNode)="fileDeleted.emit($event)"
              (setCoverImage)="setCoverImage.emit($event)">
            </texera-user-dataset-version-filetree>
          </nz-collapse-panel>
        </nz-collapse>

        <nz-divider *ngIf="writeAccess"></nz-divider>
        <texera-version-uploader
          *ngIf="writeAccess"
          [resourceId]="resourceId"
          [ownerEmail]="ownerEmail"
          [resourceName]="resourceName"
          [endpoint]="endpoint"
          [createVersion]="createVersion"
          (versionCreated)="versionCreated.emit()"
          (uploadsInFlightChange)="uploadsInFlightChange.emit($event)">
        </texera-version-uploader>
      </div>
    </nz-sider>
  </nz-layout>
</div>
