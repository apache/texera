<nz-collapse
  nzBordered="false"
  nzExpandIconPosition="end">
  <nz-collapse-panel
    [nzHeader]="snippetsHeader"
    [nzActive]="true"
    class="operator-group snippets-collapse-panel"
    [attr.data-depth]="0">
    <div class="indent snippets-section">
      <ng-container *ngIf="total > 0; else emptyState">
        <ng-container *ngFor="let group of groupedSnippets">
          <div class="snippets-section__group-name" *ngIf="groupedSnippets.length > 1">
            {{ group.category }}
          </div>
          <texera-snippet-label
            *ngFor="let snippet of group.items"
            [snippet]="snippet"></texera-snippet-label>
        </ng-container>
      </ng-container>
      <ng-template #emptyState>
        <div class="snippets-section__empty">
          Select 2+ operators and right-click to save them as a snippet.
        </div>
      </ng-template>
    </div>
  </nz-collapse-panel>
</nz-collapse>

<ng-template #snippetsHeader>
  <span class="snippets-header">
    <span class="snippets-header__icon">📦</span>
    <span>Snippets</span>
    <span class="snippets-header__count" *ngIf="total > 0">{{ total }}</span>
  </span>
</ng-template>
