<nz-collapse
  nzBordered="false"
  nzExpandIconPosition="end">
  <nz-collapse-panel
    nzHeader="Macros"
    (nzActiveChange)="$event && refresh()">
    <div class="section-header">
      <span class="muted">Saved macros</span>
      <button
        nz-button
        nzSize="small"
        type="button"
        aria-label="Refresh library"
        (click)="refresh()"
        [nzLoading]="busy">
        Refresh
      </button>
    </div>
    <p
      *ngIf="!busy && !macros.library$.value.length"
      class="empty-state">
      No saved macros yet. Create one from a selection below.
    </p>
    <p
      *ngIf="macros.library$.value.length"
      class="muted">
      Drag a macro onto the canvas.
    </p>
    <div
      *ngFor="let definition of macros.library$.value; trackBy: trackDefinition"
      class="operator-label"
      [title]="definition.name + ' · ' + revisionLabel(definition)">
      <texera-operator-label [operator]="metadata.getOperatorSchema(type(definition))"></texera-operator-label>
    </div>
    <form
      class="content-section"
      (ngSubmit)="create()">
      <label for="macro-name">Create a macro</label>
      <p
        class="muted"
        aria-live="polite">
        {{ selectionHint }}
      </p>
      <input
        nz-input
        id="macro-name"
        name="macroName"
        aria-label="Macro name"
        placeholder="Name your macro"
        [(ngModel)]="name"
        [disabled]="!canModify || busy" />
      <button
        nz-button
        nzType="primary"
        nzBlock
        type="submit"
        data-action="create"
        [nzLoading]="busy"
        [disabled]="!canModify || busy || !name.trim() || !selected.length">
        Create from selection
      </button>
    </form>
  </nz-collapse-panel>
</nz-collapse>
