<nz-table
  id="versions-list"
  nzSize="small"
  [nzSimple]="true"
  [nzFrontPagination]="false"
  nzTableLayout="auto"
  *ngIf="versionsList"
  [nzData]="versionsList">
  <thead>
    <tr>
      <th
        nzAlign="center"
        *ngFor="let column of versionTableHeaders">
        {{column}}
      </th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let row of versionsList; let i=index; let l=count;">
      <tr
        *ngIf="(!row.importance && row.expand) || row.importance"
        [ngClass]="{'selected-row': selectedRowIndex === i}">
        <td
          nzAlign="right"
          [nzShowExpand]="row.importance"
          [(nzExpand)]="row.expand"
          (nzExpandChange)="collapse(i, $event)"
          class="version-link">
          {{ getDisplayedVersionId(i, l) }}
        </td>
        <td>
          <button
            nz-button
            nzType="link"
            (click)="getVersion(row.vId, getDisplayedVersionId(i, l), i)"
            class="version-link">
            {{row.creationTime | date:'MM/dd/yy HH:mm:ss'}}
            <!--
              The version the Hub is serving, marked as a quiet second line rather than a tag: the
              panel is 230px wide, so horizontal room is scarce while vertical room is free, and the
              date is already on the line above. This is also how an author who has moved on gets the
              public copy back -- the row is here, so restoring it is the restore they already know.
            -->
            <span
              *ngIf="row.isCurrentlyPublic"
              class="publication">
              <span class="publication-mark"></span>
              Currently public
            </span>
          </button>
        </td>
      </tr>
    </ng-container>
  </tbody>
</nz-table>
