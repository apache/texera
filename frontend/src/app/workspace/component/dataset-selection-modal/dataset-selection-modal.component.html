<nz-spin [nzSpinning]="loading">
  <div class="content">
    <div class="selectors">
      <nz-select
        nzPlaceHolder="Select dataset"
        [(ngModel)]="selectedDataset"
        (ngModelChange)="onDatasetChange()"
        class="dataset-select">
        <nz-option
          *ngFor="let dataset of datasets"
          [nzValue]="dataset"
          [nzLabel]="dataset.dataset.name"
          [nzCustomContent]="true">
          <div class="dataset-option">
            #{{ dataset.dataset.did }} &nbsp;
            <span class="dataset-name">{{ dataset.dataset.name }}</span>&nbsp;
            <span class="access-level">{{ dataset.isOwner ? 'OWNER' : dataset.accessPrivilege }}</span>
          </div>
        </nz-option>
      </nz-select>

      <nz-select
        *ngIf="selectedDataset"
        nzPlaceHolder="Select version"
        [(ngModel)]="selectedVersion"
        (ngModelChange)="onVersionChange()"
        class="version-select">
        <nz-option
          *ngFor="let version of datasetVersions"
          [nzValue]="version"
          [nzLabel]="version.name">
        </nz-option>
      </nz-select>
    </div>
    <texera-user-dataset-version-filetree
      *ngIf="selectFile && suggestedFileTreeNodes.length > 0"
      [isExpandAllAfterViewInit]="true"
      [fileTreeNodes]="suggestedFileTreeNodes"
      (selectedTreeNode)="onFileTreeNodeSelected($event)">
    </texera-user-dataset-version-filetree>
  </div>
  <button
    nz-button
    nzSize="small"
    nzType="primary"
    [disabled]="!selectedFilePath"
    (click)="onConfirmSelection()">
    Select
  </button>
</nz-spin>
