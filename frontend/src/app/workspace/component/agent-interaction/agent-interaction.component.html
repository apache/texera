<div
  class="agent-interaction"
  [class.compact]="compact">
  <div class="feedback-row">
    <textarea
      nz-input
      [(ngModel)]="feedbackMessage"
      [placeholder]="compact ? 'Send feedback to agent...' : 'Provide feedback or ask questions about this operator...'"
      [nzAutosize]="{ minRows: compact ? 1 : 2, maxRows: compact ? 2 : 4 }"
      class="feedback-input"></textarea>
  </div>

  <div class="controls-row">
    <nz-select
      [(ngModel)]="selectedAgentId"
      nzPlaceHolder="Agent"
      class="agent-select"
      nzSize="small">
      <nz-option
        *ngFor="let agent of availableAgents"
        [nzValue]="agent.id"
        [nzLabel]="agent.name">
      </nz-option>
    </nz-select>

    <button
      nz-button
      nzType="primary"
      nzSize="small"
      [disabled]="!canSend()"
      (click)="sendFeedbackToAgent()"
      class="send-btn">
      <i
        nz-icon
        nzType="send"
        nzTheme="outline"></i>
      <span *ngIf="!compact">Send</span>
    </button>
  </div>
</div>
