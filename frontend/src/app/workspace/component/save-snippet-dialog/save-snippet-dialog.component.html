<div class="snippet-dialog">
  <div class="snippet-dialog__field">
    <label>Name <span class="required">*</span></label>
    <input
      nz-input
      [(ngModel)]="name"
      placeholder="My Preprocessing"
      maxlength="60"
      autofocus />
  </div>

  <div class="snippet-dialog__field">
    <label>Description</label>
    <textarea
      nz-input
      [(ngModel)]="description"
      rows="2"
      placeholder="What this snippet does (optional)"
      maxlength="240"></textarea>
  </div>

  <div class="snippet-dialog__row">
    <div class="snippet-dialog__field">
      <label>Icon</label>
      <nz-select [(ngModel)]="icon" class="icon-select">
        <nz-option
          *ngFor="let candidate of iconChoices"
          [nzValue]="candidate"
          [nzLabel]="candidate"></nz-option>
      </nz-select>
    </div>
    <div class="snippet-dialog__field">
      <label>Category</label>
      <input
        nz-input
        [(ngModel)]="category"
        placeholder="My Snippets" />
    </div>
  </div>

  <div class="snippet-dialog__preview">
    <div class="snippet-dialog__preview-header">
      Preview · {{ operatorCount }} operator(s), {{ linkCount }} link(s)
    </div>
    <div class="snippet-dialog__chain">
      <ng-container *ngFor="let label of previewLabels; let last = last">
        <span class="snippet-dialog__node">{{ label }}</span>
        <span *ngIf="!last" class="snippet-dialog__arrow">→</span>
      </ng-container>
    </div>
  </div>

  <div class="snippet-dialog__field">
    <label nz-checkbox [(ngModel)]="isPublic">Share with team (public)</label>
  </div>

  <div class="snippet-dialog__actions">
    <button nz-button (click)="cancel()">Cancel</button>
    <button
      nz-button
      nzType="primary"
      [disabled]="!name.trim()"
      (click)="save()">
      Save snippet
    </button>
  </div>
</div>
