<div class="mount-modal">
  <div class="mount-modal-header">
    <span class="mount-modal-subtitle"
      >Datasets you mount here are available to Python UDFs running on this computing unit.</span
    >
    <button
      nz-button
      nzType="primary"
      nzSize="small"
      [nzLoading]="mounting"
      (click)="onClickAddDataset()">
      <i
        nz-icon
        nzType="plus"></i>
      Mount dataset
    </button>
  </div>

  <nz-spin [nzSpinning]="loading">
    <div
      *ngIf="mounts.length > 0; else emptyTpl"
      class="mount-list">
      <div
        class="mount-row"
        *ngFor="let mount of mounts">
        <i
          nz-icon
          nzType="database"
          class="mount-row-icon"></i>
        <span
          class="mount-row-name"
          [title]="mount.mountPath"
          >{{ displayName(mount) }}</span
        >
      </div>
    </div>
    <ng-template #emptyTpl>
      <nz-empty nzNotFoundContent="No datasets mounted yet"></nz-empty>
    </ng-template>
  </nz-spin>
</div>
