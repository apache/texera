<!-- The operator canvas's title row, rebuilt here to the same measurements: same
     height, same rule underneath, same full-bleed width, and the view switch pinned to
     the same right inset ahead of the same user icon. The content below is padded and
     centred, which is why the switch cannot live down there -- it would stop at the
     column edge and never line up with the other view. -->
<div class="pc-topbar">
  <nz-avatar
    *ngIf="wid"
    class="wid"
    [nzText]="wid.toString()"></nz-avatar>
  <!-- An input, not a label: the workflow can be renamed from either view, with the same
       control in the same place. -->
  <input
    class="wf-name"
    [(ngModel)]="workflowName"
    (change)="onRenameWorkflow()"
    placeholder="Untitled workflow" />
  <!-- Editing here writes to the same workflow, so it earns the same reassurance the
       operator canvas gives: the moment it was last saved. -->
  <span class="saved-state">{{ autoSaveState }}</span>
  <span class="topbar-spacer"></span>
  <div class="view-switch">
    <button
      type="button"
      aria-pressed="false"
      (click)="openRegularCanvas()">
      Canvas
    </button>
    <button
      type="button"
      class="on"
      aria-pressed="true">
      Form View
    </button>
  </div>
  <!-- Live collaborators, the same avatars the operator canvas shows -- Form view is just
       another view of the same shared workflow, so co-editors belong here too. -->
  <ng-container *ngFor="let user of coeditorPresenceService.coeditors">
    <texera-coeditor-user-icon [coeditor]="user"></texera-coeditor-user-icon>
  </ng-container>
  <texera-user-icon></texera-user-icon>
</div>

<div class="pc-page">
  <div class="pc-rule"></div>

  <div
    *ngIf="loading"
    class="pc-loading">
    Loading…
  </div>

  <div [hidden]="loading">
    <!-- The author's one piece of guidance, shown as rendered markdown, collapsible, and only when
         there is instruction text to show. Editing it is part of the authoring PR. -->
    <section
      class="card instr"
      *ngIf="hasInstruction"
      [class.open]="instructionOpen">
      <button
        type="button"
        class="instr-bar"
        [attr.aria-expanded]="instructionOpen"
        (click)="toggleInstruction()">
        <i
          nz-icon
          nzType="info-circle"
          class="lead"
          aria-hidden="true"></i>
        <h2>{{ instructionTitle || "How to use this" }}</h2>
        <i
          nz-icon
          nzType="down"
          class="chev"
          aria-hidden="true"></i>
      </button>

      <div
        class="instr-body"
        [hidden]="!instructionOpen">
        <div
          class="md"
          [innerHTML]="instructionPreviewHtml"></div>
      </div>
    </section>

    <!-- The inputs an author exposed, each rendered as its operator's own field. -->
    <div class="pc-section-head">
      <span class="label">Inputs</span>
    </div>

    <div
      class="empty"
      *ngIf="visibleFields.length === 0">
      This workflow has no inputs to fill in.
    </div>

    <div class="params">
      <section
        class="card param"
        [class.read-only]="!canEdit"
        *ngFor="let r of rendered; trackBy: trackByRendered">
        <!-- The operator's own field, so a file property gets the real file picker and an
             attribute property a column dropdown. -->
        <form
          [formGroup]="r.form"
          class="param-form">
          <formly-form
            [model]="r.model"
            [fields]="r.fields"
            [form]="r.form"></formly-form>
        </form>

        <!-- The one line of guidance a reader gets, when the author wrote one. The operator
             schema's own field descriptions are dropped (author notes, not reader guidance), so
             this is the only help text under an input. -->
        <p
          *ngIf="r.resolved.binding.helpText"
          class="param-help-text">
          {{ r.resolved.binding.helpText }}
        </p>
      </section>
    </div>

    <!-- Run and the unit it runs on sit together, because one gates the other, but they stay two
         controls: the selector draws its own bordered box. Adjacency and equal height say they
         belong to each other. -->
    <div class="runbar">
      <div class="run-group">
        <!-- One button in this page's own style, but its label, icon and disabled-ness are the
             operator canvas's own (menu.component's getRunButtonBehavior): "Invalid" / "Empty" for a
             graph that cannot run, "Connecting" while a unit's socket comes up, "Connect" before one
             is chosen, "Run" once ready, "Stop" while running. Disabled in every state a run cannot
             start from, so the reader is never sent to press a button that does nothing. -->
        <button
          class="run"
          [class.stop]="isRunning"
          [class.connecting]="runButtonState.disabled && !isRunning"
          [disabled]="runButtonState.disabled"
          (click)="onRun()">
          <i
            nz-icon
            [nzType]="runButtonState.icon"
            aria-hidden="true"></i>
          {{ runButtonState.label }}
        </button>
        <!-- The page opens its own connection on load, so this control no longer decides whether
             running works by where it is mounted. -->
        <div class="run-unit">
          <texera-computing-unit-selection></texera-computing-unit-selection>
        </div>
        <!-- How long this has been going, from the same engine event the operator canvas counts. It
             appears only once there is something to count, so a form at rest is not carrying a
             0:00:00 around. -->
        <span
          class="run-clock"
          *ngIf="executionDuration > 0">
          {{ executionDuration | date: "H:mm:ss" : "UTC" }}
        </span>
      </div>
    </div>
    <!-- On its own line: a message that explains or blocks the run should not push the two controls
         apart, and it is absent most of the time. -->
    <p
      class="run-note"
      [class.err]="runError"
      [attr.role]="runError ? 'alert' : 'status'"
      *ngIf="runError || isRunning">
      {{ runError || "Running -- this keeps going if you look away." }}
    </p>

    <!-- The workflow, out of the way unless the reader goes looking. Results are added on top of
         this by the following PR. -->
    <section
      class="card wf"
      [class.open]="workflowOpen">
      <button
        type="button"
        class="wf-bar"
        [attr.aria-expanded]="workflowOpen"
        (click)="toggleWorkflow()">
        <i
          nz-icon
          nzType="down"
          class="chev"
          aria-hidden="true"></i>
        <span class="wf-titles">
          <span class="wf-title">Workflow</span>
          <span class="wf-sub">Optional. The steps that will run.</span>
        </span>
        <span class="spacer"></span>
      </button>

      <div
        class="wf-body"
        [hidden]="!workflowOpen">
        <texera-workflow-editor
          *ngIf="workflowEverOpened"
          [structureLocked]="true"></texera-workflow-editor>
        <texera-mini-map
          *ngIf="workflowEverOpened"
          class="box"></texera-mini-map>
      </div>
    </section>
  </div>
</div>
