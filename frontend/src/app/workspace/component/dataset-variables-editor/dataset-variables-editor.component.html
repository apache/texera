<div class="dataset-variables">
  <div
    *ngIf="activeCuid == null"
    class="dataset-variables-hint">
    Select a computing unit to mount datasets and bind them here.
  </div>
  <div
    *ngIf="activeCuid != null && !activeCuIsKubernetes"
    class="dataset-variables-hint">
    Dataset mounting is only available on Kubernetes computing units.
  </div>
  <div
    *ngIf="activeCuIsKubernetes && mountedDatasetPaths.length === 0 && !loading"
    class="dataset-variables-hint">
    No datasets are mounted on the active computing unit yet. Use "Mount datasets into computing unit" on the computing
    unit to add one.
  </div>

  <div
    class="dataset-variable-row"
    *ngFor="let row of rows; let i = index; trackBy: trackByIndex">
    <input
      nz-input
      class="dataset-variable-name"
      placeholder="variable"
      [(ngModel)]="row.variableName"
      (ngModelChange)="onRowChange()" />
    <span class="dataset-variable-arrow">=</span>
    <nz-select
      class="dataset-variable-select"
      nzShowSearch
      nzAllowClear
      nzPlaceHolder="mounted dataset"
      [(ngModel)]="row.datasetPath"
      (ngModelChange)="onRowChange()">
      <nz-option
        *ngFor="let path of optionsForRow(row)"
        [nzValue]="path"
        [nzLabel]="path"></nz-option>
    </nz-select>
    <i
      nz-icon
      nzType="delete"
      class="dataset-variable-remove"
      nz-tooltip
      [nzTooltipTitle]="'Remove'"
      (click)="removeRow(i)"
      role="button"
      aria-label="Remove variable"></i>
  </div>

  <button
    nz-button
    nzType="dashed"
    nzSize="small"
    class="dataset-variables-add"
    (click)="addRow()">
    <i
      nz-icon
      nzType="plus"></i>
    Add variable
  </button>
</div>
