<div id="workflow-editor-wrapper">
  <div
    id="workflow-editor"
    (contextmenu)="nzContextMenu.create($event, menu)"></div>

  <!-- Empty-canvas BioFlow Genesis hint -->
  <div
    *ngIf="showEmptyHint"
    class="genesis-empty-hint"
    [class.genesis-empty-hint--dragging]="isFileDragging"
    aria-hidden="true">
    <div class="genesis-empty-hint__icon">
      <svg
        width="42"
        height="42"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M7 3c0 5 10 7 10 12s-10 1-10 6" />
        <path d="M17 3c0 5-10 7-10 12s10 1 10 6" />
        <path d="M8 6h8" />
        <path d="M8 18h8" />
        <path d="M9.5 9h5" />
        <path d="M9.5 15h5" />
      </svg>
    </div>
    <h3 class="genesis-empty-hint__title">Drop a CSV file to begin</h3>
    <p class="genesis-empty-hint__desc">
      BioFlow Genesis analyzes your data and builds a workflow with AI in seconds.
    </p>
    <div class="genesis-empty-hint__pills">
      <span>diabetes</span>
      <span class="genesis-empty-hint__sep">·</span>
      <span>heart disease</span>
      <span class="genesis-empty-hint__sep">·</span>
      <span>classification</span>
      <span class="genesis-empty-hint__sep">·</span>
      <span>regression</span>
    </div>
  </div>
  <nz-dropdown-menu
    nzNoAnimation
    #menu="nzDropdownMenu">
    <texera-context-menu></texera-context-menu>
  </nz-dropdown-menu>

  <!-- Chat Popover for Operator -->
  <div
    class="chat-popover-container"
    *ngIf="chatPopoverOperator"
    [style.left.px]="chatPopoverOperator.position.x"
    [style.top.px]="chatPopoverOperator.position.y">
    <div
      class="chat-popover"
      [class.chat-popover-visualization]="isOperatorVisualization(chatPopoverOperator.operatorId)">
      <div class="chat-popover-content">
        <texera-agent-interaction
          [operatorId]="chatPopoverOperator.operatorId"
          [operatorDisplayName]="chatPopoverOperator.displayName"
          [sampleRecords]="getOperatorSampleRecords(chatPopoverOperator.operatorId)"
          [resultStatistics]="getOperatorResultStatistics(chatPopoverOperator.operatorId)">
        </texera-agent-interaction>
      </div>
    </div>
  </div>
</div>
