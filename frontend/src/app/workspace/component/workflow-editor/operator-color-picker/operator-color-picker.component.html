<p>Apply to {{ data.operatorIDs.length }} selected operator{{ data.operatorIDs.length === 1 ? "" : "s" }}.</p>
<div
  class="color-options"
  role="group"
  aria-label="Operator color">
  <button
    type="button"
    [disabled]="!canEdit"
    [attr.aria-pressed]="isSelected(undefined)"
    (click)="setColor(undefined)">
    Default
  </button>
  <button
    *ngFor="let preset of presets"
    type="button"
    [disabled]="!canEdit"
    [style.background-color]="preset.fill"
    [attr.aria-pressed]="isSelected(preset.id)"
    (click)="setColor(preset.id)">
    {{ preset.label }}
  </button>
</div>
<p class="color-help">
  Colors label steps; they do not change execution. Heat maps temporarily override these colors. Disabled operators stay
  gray.
</p>
