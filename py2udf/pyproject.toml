[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texera-python-to-workflow"
version = "0.1.0"
description = "Statement-level Python-to-Texera workflow compiler"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://texera.io/"
Repository = "https://github.com/apache/texera"

[tool.setuptools]
package-dir = {"" = "src/main/python"}

[tool.setuptools.packages.find]
where = ["src/main/python"]
include = ["python_to_workflow", "python_to_workflow.mosaic*"]

[tool.pytest.ini_options]
pythonpath = ["src/main/python"]
testpaths = ["src/test/python"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
