name: texera-lakefs
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: texera-lakefs-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=texera_rustfs
      - RUSTFS_SECRET_KEY=password
      # Must match the region the AWS SDK signs with: it is part of the SigV4 scope.
      - RUSTFS_REGION=us-west-2
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    # The lines below are recommended to mount a host path in order to persist your data even if the container is removed.
    volumes:
      - rustfs_data:/data

  postgres:
    image: postgres:15
    container_name: texera-lakefs-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=texera_lakefs
      - POSTGRES_USER=texera_lakefs_admin
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "texera_lakefs_admin", "-d", "texera_lakefs"]
      interval: 10s
      retries: 5
      start_period: 5s
    # Ditto
    volumes:
      - postgres_data:/var/lib/postgresql/data

  lakefs:
    image: treeverse/lakefs:1.51
    container_name: texera-lakefs-lakefs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=http://rustfs:9000
      - LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT=http://localhost:9000
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=texera_rustfs
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=password
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=random_string_for_lakefs
      - LAKEFS_LOGGING_LEVEL=INFO
      - LAKEFS_STATS_ENABLED=1
      - LAKEFS_DATABASE_TYPE=postgres
      - LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING=postgres://texera_lakefs_admin:password@postgres:5432/texera_lakefs?sslmode=disable
      - LAKEFS_INSTALLATION_USER_NAME=texera-admin
      - LAKEFS_INSTALLATION_ACCESS_KEY_ID=AKIAIOSFOLKFSSAMPLES
      - LAKEFS_INSTALLATION_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        lakefs setup --user-name "$$LAKEFS_INSTALLATION_USER_NAME" --access-key-id "$$LAKEFS_INSTALLATION_ACCESS_KEY_ID" --secret-access-key "$$LAKEFS_INSTALLATION_SECRET_ACCESS_KEY" || true
        lakefs run &
        echo "---- lakeFS Web UI ----"
        echo "http://127.0.0.1:8000/"
        echo ""
        echo "Access Key ID    : $$LAKEFS_INSTALLATION_ACCESS_KEY_ID"
        echo "Secret Access Key: $$LAKEFS_INSTALLATION_SECRET_ACCESS_KEY"
        echo ""
        wait

networks:
  default:
    name: texera-lakefs

# Named Docker volumes — uncomment the following lines if you mounted host paths above.
volumes:
  rustfs_data:
  postgres_data:
