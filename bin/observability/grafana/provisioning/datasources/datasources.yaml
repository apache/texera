# Grafana datasource provisioning for the Texera bundled observability
# stack. Grafana (AGPLv3) reads the three Apache-2.0 query backends by
# their docker-compose bridge-network service names. This file is only
# ASF-licensed configuration; Grafana itself is an optional operator-run
# component and is NOT shipped in any Texera release artifact (see
# bin/observability/README.md).
apiVersion: 1

datasources:
  # Metrics: VictoriaMetrics speaks the Prometheus query API, so it is
  # added as a prometheus-type datasource. Marked default.
  - name: Metrics
    type: prometheus
    uid: metrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false

  # Logs: Loki, LogQL over OTLP-ingested logs.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # Traces: Jaeger query API / UI backend.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
