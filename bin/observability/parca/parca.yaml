# Parca server configuration.
#
# This is the minimal config the Texera bundled observability stack
# uses. We deliberately keep scrape_configs empty — profiles arrive
# from the Parca eBPF agent (push model) rather than pull-mode scraping.
# Bundled image: ghcr.io/parca-dev/parca:v0.28.0 (Apache-2.0).
#
# Storage is intentionally filesystem-backed for the single-node
# docker-compose deployment. Replace with an object-storage backend
# (S3/GCS/Azure) before any multi-node or production use.

object_storage:
  bucket:
    # FILESYSTEM is the simplest backend for single-node development.
    # Data lives inside the container at this path; mount a volume
    # in docker-compose to persist across container restarts.
    type: "FILESYSTEM"
    config:
      directory: "/var/lib/parca"

# scrape_configs is intentionally empty: the Texera deployment pushes
# profiles from the parca-agent via OTLP/gRPC. Adding scrape targets
# here would generate significantly more data than agent-based
# profiling per the upstream recommendation.
scrape_configs: []
