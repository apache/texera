# OpenTelemetry Collector configuration for the Texera bundled
# observability stack.
#
# Bundled image: otel/opentelemetry-collector-contrib:0.153.0
# (Apache-2.0). The contrib distribution is needed for the
# prometheusremotewrite exporter that fans metrics to VictoriaMetrics.
#
# Pipeline topology:
#
#   Texera services
#     │ OTLP/gRPC (4317) or OTLP/HTTP (4318)
#     ▼
#   otel-collector
#     ├── logs    ── OTLP ──────────────────► victorialogs:9428
#     ├── metrics ── prometheusremotewrite ─► victoriametrics:8428
#     └── traces  ── OTLP ──────────────────► jaeger:4317
#
# Network: every receiver and exporter is reachable only on the
# compose bridge network. No host-port mapping for the receivers in
# docker-compose.yml — that keeps OTLP ingest cluster-local, which
# is the security posture the PR plan calls for.
#
# Hostnames below are docker-compose service names — they resolve via
# docker's embedded DNS inside the network.

receivers:
  otlp:
    protocols:
      grpc:
        # 0.0.0.0 binds inside the container only; the compose service
        # does NOT publish this port to the host. Reachable only via
        # the texera-single-node bridge network.
        endpoint: 0.0.0.0:4317
        # 4 MiB cap on a single OTLP message — anyone trying to spam
        # the collector with a huge payload gets a clean reject.
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318

processors:
  # batch is the upstream-recommended first processor. Caps memory
  # per export by batching by either size or timeout, whichever hits
  # first. Defaults are sensible for a single-node deployment.
  batch:
    send_batch_size: 1024
    timeout: 5s

  # memory_limiter prevents the collector OOMing under a sudden burst
  # of telemetry. We set a soft limit, not a hard percentage, so the
  # numbers are reviewable.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # VictoriaLogs accepts OTLP for logs natively (verify on every
  # version bump). The endpoint path includes /opentelemetry/v1/logs
  # per VictoriaLogs's OTLP ingest convention.
  otlphttp/victorialogs:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    compression: gzip
    timeout: 10s
    # tls is disabled for the compose bridge network. Any deploy
    # that opens these ports beyond the bridge must enable TLS here.
    tls:
      insecure: true

  # VictoriaMetrics consumes Prometheus remote-write natively. The
  # prometheusremotewrite exporter is the upstream-recommended way
  # to bridge OTel metrics into Prom-ecosystem stores.
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    # Keep the remote-write batch bounded so a metric burst can't
    # become an oversized HTTP request.
    remote_write_queue:
      queue_size: 1000
      num_consumers: 4

  # Jaeger v2 accepts OTLP directly — no jaeger exporter type needed.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]

  # Collector telemetry binds to loopback inside the container only
  # so we can scrape /metrics from a sidecar if needed without
  # exposing the collector's own metrics to the host.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
    logs:
      level: info
