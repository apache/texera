# Dedicated entry point for the observability stack, so it can be started like
# the other dev targets (e.g. file-service's own compose) instead of reaching
# into the single-node deployment file.
#
# It does NOT redefine the services: it `include`s the single-node compose, the
# single source of truth for every container definition. The observability
# services there are gated behind compose profiles, so they are selected via
# COMPOSE_PROFILES + the service list (see start_app.sh `up_obs`). The other
# single-node services are not profile-gated, so they are simply not named and
# stay down.
#
# Relative volume paths inside the included file (e.g. the collector/parca
# configs under ../observability/) are resolved relative to the included file's
# own directory, so they keep working unchanged.
#
# The project name matches single-node so this manages the SAME containers
# whether obs is brought up here or as part of the full single-node deployment
# (the containers use fixed container_names, so a different project would clash).
name: texera-single-node

include:
  - ../single-node/docker-compose.yml
