apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: texera-static-routes
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
  {{- if and .Values.gatewayConfig .Values.gatewayConfig.hostname }}
  hostnames:
    - {{ .Values.gatewayConfig.hostname }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/computing-unit
      backendRefs:
        - name: workflow-computing-unit-manager-svc
          port: 8888
    - matches:
        - path:
            type: PathPrefix
            value: /api/compile
      backendRefs:
        - name: workflow-compiling-service-svc
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /api/dataset
        - path:
            type: PathPrefix
            value: /api/access/dataset
      backendRefs:
        - name: file-service-svc
          port: 9092
    - matches:
        - path:
            type: PathPrefix
            value: /api/access/computing-unit
      backendRefs:
        - name: workflow-computing-unit-manager-svc
          port: 8888
    - matches:
        - path:
            type: PathPrefix
            value: /api/config
      backendRefs:
        - name: config-service-svc
          port: 9094
    - matches:
        - path:
            type: PathPrefix
            value: /rtc
      backendRefs:
        - name: y-websocket-server-svc
          port: 1234
    - matches:
        - path:
            type: PathPrefix
            value: /python-language-server
      backendRefs:
        - name: python-language-server-svc
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webserver-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: texera-dynamic-routes
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
  {{- if and .Values.gatewayConfig .Values.gatewayConfig.hostname }}
  hostnames:
    - {{ .Values.gatewayConfig.hostname }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /wsapi
        - path:
            type: RegularExpression
            value: "^/api/executions/\\d+/stats/\\d+$"
        - path:
            type: PathPrefix
            value: /api/executions/result/export
      backendRefs:
        - name: webserver-svc # Placeholder, overridden by EnvoyPatchPolicy
          port: 8080
