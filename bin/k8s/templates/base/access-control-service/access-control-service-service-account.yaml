{{- if .Values.mounter.enabled }}

# Dedicated identity for the access-control-service.
#
# The access-control-service is intended to become the only component allowed to ask the
# per-node mounter to mount a dataset: it is already the JWT and computing-unit-access
# authorization proxy, so it is the natural place for the decision "may this user mount
# onto this CU?". Giving it its own identity now is what makes that switch a config
# change later, rather than a redesign -- running as the namespace's `default`
# ServiceAccount (shared with every pod that does not name one) would make the mounter
# unable to tell this service apart from anything else.
#
# The enforcement mechanism already exists and is live in this PR; only the identity in
# the allow-list is still provisional:
#
#   1. The calling pod mounts a projected `serviceAccountToken` volume bound to the
#      audience `texera-mounter` and sends that token as a Bearer header on each mounter
#      request. The audience binding means the token is only usable against the mounter --
#      it is not the pod's general-purpose kube-apiserver token, and a token minted for
#      any other audience will not validate here.
#   2. The mounter posts the token to the kube-apiserver's TokenReview API and accepts the
#      request only when the response reports `authenticated: true`, the requested audience
#      among `status.audiences`, and a `status.user.username` listed in
#      `mounter.allowedCallers`. Verification happens at the API server, so it holds
#      regardless of how the request reached the mounter -- unlike a NetworkPolicy, which
#      is unenforced on CNIs that do not implement it and is routinely bypassed by hostPort
#      traffic. See authenticate_caller in bin/mounter/mounter.py.
#   3. The mounter's own ServiceAccount is bound to the built-in `system:auth-delegator`
#      ClusterRole, which is what grants it permission to create TokenReviews.
#
# TODO(dataset-mount): today `mounter.allowedCallers` defaults to the computing-unit
# manager, because that is the service which actually calls the mounter. Point it at this
# account -- and move the mount endpoints behind this service -- once access-control-service
# takes over as the mount authority. Nothing else has to change.
#
# Either way, computing-unit pods are never an accepted caller even though they can reach
# the mounter's hostPort: they hold no token for this audience, so a mount request forged
# from user code fails the TokenReview regardless of what it puts in the request body. And
# because authenticating the caller only establishes who is asking, the mounter still
# validates every path component of the request itself.
#
# This account needs no RBAC rules: it is an identity to authenticate as, not a client
# of the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.accessControlService.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
{{- end }}
