# The mounter's reaper reads computing-unit pods (in the pool namespace) to detect
# when a CU is gone and unmount its orphaned mounts. It needs only read access to pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mounter.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-mounter
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-mounter-binding
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.mounter.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-mounter
  apiGroup: rbac.authorization.k8s.io
