apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["metrics.k8s.io"] # Added metrics permissions
    resources: ["pods"]
    verbs: ["list", "get"] # Added metrics permissions
  # Validating a curated image runs as a Job here, and its outcome is read back from the
  # Job and from its pod's log -- a Job cannot return a value.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}-binding
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.workflowComputingUnitManager.name }}
  apiGroup: rbac.authorization.k8s.io

---
# The pre-pull DaemonSets live in the release namespace, alongside the chart's own two
# pre-pullers, so this is a second Role rather than another rule on the pool one. The pool
# namespace carries a ResourceQuota on requests.cpu/requests.memory, and quota admission
# checks init containers, so a pre-pull pod there is refused before it is ever scheduled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}-prepull
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}-prepull-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.workflowComputingUnitManager.name }}-prepull
  apiGroup: rbac.authorization.k8s.io
