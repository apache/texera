apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["metrics.k8s.io"] # Added metrics permissions
    resources: ["pods"]
    verbs: ["list", "get"] # Added metrics permissions
  # Validating a curated image runs as a Job here, and its outcome is read back from the
  # Job and from its pod's log -- a Job cannot return a value.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # One DaemonSet per ready curated image, created as images are registered, so the chart
  # cannot declare them. Scoped here and not to the release namespace, which holds the
  # privileged mounter.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workflowComputingUnitManager.name }}-binding
  namespace: {{ .Values.workflowComputingUnitPool.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.workflowComputingUnitManager.name }}
  apiGroup: rbac.authorization.k8s.io

---
# Read-only, cluster-wide, for the admin cluster-capacity endpoint. Nodes are cluster-scoped, and
# what a new computing unit can claim of them depends on the requests of the pods of every
# namespace, not only the pool's, so this cannot be the namespaced Role above. It only lists: the
# endpoint reads the nodes and pods once per request and never watches or fetches one by name.
# Named for the release because a ClusterRole is cluster-scoped and releases would collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}-cluster-capacity
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}-cluster-capacity
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflowComputingUnitManager.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Values.workflowComputingUnitManager.name }}-cluster-capacity
  apiGroup: rbac.authorization.k8s.io
