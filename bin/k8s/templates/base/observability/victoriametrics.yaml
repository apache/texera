{{- if and .Values.observability.enabled .Values.observability.metrics.enabled }}
# VictoriaMetrics: metrics store, k8s counterpart of the docker-compose
# victoriametrics service. Accepts Prometheus remote-write from the
# collector; MetricsQL query API on the same port.
{{ include "texera.observability.dataClaim" (dict "release" .Release "app" "victoriametrics" "storage" .Values.observability.metrics) }}
---
{{ include "texera.deploymentHeader" (dict "release" .Release "name" "victoriametrics" "replicas" 1 "recreate" true) }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        fsGroup: 10003
      containers:
        - name: victoriametrics
          image: {{ .Values.observability.metrics.image }}
          imagePullPolicy: {{ .Values.texeraImages.pullPolicy }}
          args:
            - "-storageDataPath=/data"
            - "-retentionPeriod={{ .Values.observability.metrics.retentionPeriod }}"
            - "-httpListenAddr=:{{ .Values.observability.metrics.port }}"
          {{- include "texera.observability.containerSecurityContext" true | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.observability.metrics.port }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.observability.metrics.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.observability.metrics.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-victoriametrics-data
---
{{ include "texera.observability.service" (dict "release" .Release "app" "victoriametrics" "ports" (list
    (dict "name" "http" "port" .Values.observability.metrics.port)
)) }}
{{- end }}
