{{- if and .Values.observability.enabled .Values.observability.traces.enabled }}
# Jaeger v2: traces backend + UI, k8s counterpart of the docker-compose
# jaeger service. v2 accepts OTLP natively (the collector exports here on
# otlpPort). In-memory storage: a restart wipes traces, same as the
# single-node compose. Swap in a persistent storage backend for
# multi-node / production use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-jaeger
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-jaeger
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: jaeger
          image: {{ .Values.observability.traces.image }}
          imagePullPolicy: {{ .Values.texeraImages.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: query
              containerPort: {{ .Values.observability.traces.queryPort }}
            - name: otlp-grpc
              containerPort: {{ .Values.observability.traces.otlpPort }}
          resources:
            {{- toYaml .Values.observability.traces.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-jaeger
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-jaeger
  ports:
    - name: query
      protocol: TCP
      port: {{ .Values.observability.traces.queryPort }}
      targetPort: {{ .Values.observability.traces.queryPort }}
    - name: otlp-grpc
      protocol: TCP
      port: {{ .Values.observability.traces.otlpPort }}
      targetPort: {{ .Values.observability.traces.otlpPort }}
{{- end }}
