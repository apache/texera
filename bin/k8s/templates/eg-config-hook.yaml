apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-eg-setup-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: texera-eg-setup-role
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: texera-eg-setup-binding
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
subjects:
  - kind: ServiceAccount
    name: texera-eg-setup-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: texera-eg-setup-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: texera-eg-enable-backend
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  template:
    spec:
      serviceAccountName: texera-eg-setup-sa
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Checking Envoy Gateway configuration..."
              CM_NAMESPACE="envoy-gateway-system"
              CM_NAME="envoy-gateway-config"
              
              # Check if CM exists
              if ! kubectl get cm $CM_NAME -n $CM_NAMESPACE; then
                echo "ConfigMap $CM_NAME not found in $CM_NAMESPACE. Is Envoy Gateway installed?"
                exit 0 # Don't fail, maybe they use a different setup
              fi

              # Patch to enable Backend
              echo "Enabling Backend API..."
              kubectl patch cm $CM_NAME -n $CM_NAMESPACE --type merge -p '{"data":{"envoy-gateway.yaml":"apiVersion: gateway.envoyproxy.io/v1alpha1\nkind: EnvoyGateway\nextensionApis:\n  enableEnvoyPatchPolicy: true\n  enableBackend: true\ngateway:\n  controllerName: gateway.envoyproxy.io/gatewayclass-controller\nlogging:\n  level:\n    default: info\nprovider:\n  kubernetes:\n    rateLimitDeployment:\n      container:\n        image: docker.io/envoyproxy/ratelimit:3fb70258\n      patch:\n        type: StrategicMerge\n        value:\n          spec:\n            template:\n              spec:\n                containers:\n                - imagePullPolicy: IfNotPresent\n                  name: envoy-ratelimit\n    shutdownManager:\n      image: docker.io/envoyproxy/gateway:v1.6.3\n  type: Kubernetes"}}'
              
              # Restart EG if needed (blind restart for simplicity to ensure config pick-up)
              echo "Restarting Envoy Gateway controller..."
              kubectl rollout restart deployment envoy-gateway -n $CM_NAMESPACE
      restartPolicy: OnFailure
