# Local-dev override, auto-loaded by `docker compose` when run from this
# directory. It publishes the OTel collector's OTLP receiver ports on the
# host loopback so a backend running outside docker (sbt / IntelliJ) can
# emit telemetry to the collector. The released bundle does not ship this
# file, so the base compose stays network-clean in a deploy.
name: texera-single-node

services:
  otel-collector:
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
