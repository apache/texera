# Observability emission overlay. Loaded only by `bin/single-node.sh up
# --with-observability`, it sets OTEL_SDK_DISABLED=false on the instrumented
# services so they emit to the bundled collector. The base .env keeps emission
# off by default; this overlay flips it on without editing .env. The collector
# and signal backends themselves come up via the observability-* compose
# profiles the same command enables.
name: texera-single-node

services:
  access-control-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  config-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  dashboard-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  file-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  notebook-migration-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  workflow-compiling-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  workflow-computing-unit-managing-service:
    environment:
      OTEL_SDK_DISABLED: "false"
  workflow-runtime-coordinator-service:
    environment:
      OTEL_SDK_DISABLED: "false"
