version=2.6.4
maxColumn = 100

# scalafmt 2.6.4's scalameta parser cannot parse escaped double-quotes inside
# interpolated strings (e.g. s"...\"$x\"...") in these files — it fails with
# "') expected but string constant found". The code is valid Scala and compiles
# fine; exclude these files from formatting until scalafmt is upgraded. (The
# escaped quotes in AggregateOpDesc are part of generated Python and must stay.)
project.excludeFilters = [
  "PyOpExecHarness.scala",
  "AggregateOpDesc.scala",
  "ConfigGenerator.scala"
]
