frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'

common:
  - changed-files:
      - any-glob-to-any-file:
          - 'common/**'
          # Root-level Scala build / lint config: a change to any of these
          # affects every Scala stack (amber + the platform services).
          - 'build.sbt'
          - 'project/**'
          - '.scalafix.conf'
          - '.scalafmt.conf'

platform:
  - changed-files:
      - any-glob-to-any-file:
          - 'access-control-service/**'
          - 'computing-unit-managing-service/**'
          - 'config-service/**'
          - 'file-service/**'
          - 'workflow-compiling-service/**'

agent-service:
  - changed-files:
      - any-glob-to-any-file:
          - 'agent-service/**'

engine:
  # Non-Python, non-integration parts of amber/. Pure Python changes
  # under amber/src/main/python/** intentionally fall through to the
  # `python` label (which the labeler also matches via **/*.py), so
  # they only trigger the python + amber-integration stacks rather
  # than the full Scala-only `amber` stack. Integration specs live
  # under amber/src/test/integration/** (added to sbt's Test sources
  # via amber/build.sbt) and are caught by the `amber-integration`
  # label below.
  - changed-files:
      - any-glob-to-any-file:
          - 'amber/build.sbt'
          - 'amber/project/**'
          - 'amber/src/main/scala/**'
          - 'amber/src/main/java/**'
          - 'amber/src/main/protobuf/**'
          - 'amber/src/main/resources/**'
          - 'amber/src/test/scala/**'
          - 'amber/src/test/java/**'

amber-integration:
  # Scala specs that exercise both Scala and Python end-to-end. They
  # live under amber/src/test/integration/scala/** (sbt's Test config
  # picks them up via amber/build.sbt) and are tagged
  # @org.apache.texera.amber.tags.IntegrationTest. This label maps to
  # the amber-integration stack only, so a PR that touches just an
  # integration spec does not pay for the full Scala-only `amber` job.
  - changed-files:
      - any-glob-to-any-file:
          - 'amber/src/test/integration/**'

python:
  - changed-files:
      - any-glob-to-any-file:
          - 'amber/src/main/python/**'
          - '**/*.py'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - 'NOTICE'
          - 'LICENSE'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.asf.yaml'
          - 'codecov.yml'

dev:
  - changed-files:
      - any-glob-to-any-file:
          - 'bin/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/requirements.txt'
          - '**/package.json'
          - '**/build.sbt'
          - '**/project.sbt'

ddl-change:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.sql'

feature:
  - head-branch:
      - '^feat'
      - 'feature'

fix:
  - head-branch: '^fix'

refactor:
  - head-branch: '^refactor'

