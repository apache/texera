name: Backport
run-name: Backport (PR #${{ github.event.pull_request.number }})

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-stale-runs:
    name: Cleanup stale backport runs
    if: ${{ github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete prior Backport runs for this PR head
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const currentRunId = context.runId;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: "backport-ci.yml",
                head_sha: headSha,
                per_page: 100,
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId) continue;
              core.info(`Deleting backport run ${run.id} (${run.display_title})`);
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
              } catch (e) {
                core.warning(`Failed to delete run ${run.id}: ${e.message}`);
              }
            }

  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.decide.outputs.targets }}
      has_targets: ${{ steps.decide.outputs.has_targets }}
    steps:
      - name: Decide backport targets
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const action = context.payload.action;
            let targets = [];

            if (action === "labeled") {
              const newLabel = context.payload.label && context.payload.label.name;
              if (newLabel && /^release\/.+$/.test(newLabel)) {
                targets = [newLabel];
              }
            } else {
              // opened/reopened/synchronize/unlabeled - re-validate every
              // remaining release/* label so the PR ends up with a clean,
              // current set of backport checks (cleanup-stale-runs deletes
              // the old ones for unlabeled events).
              const labels = context.payload.pull_request.labels.map((l) => l.name);
              targets = [...new Set(labels.filter((n) => /^release\/.+$/.test(n)))].sort();
            }

            if (targets.length === 0) {
              core.info(`No backport target for action=${action} on PR #${context.payload.pull_request.number}; skipping backport job.`);
            } else {
              core.info(`Backport targets for PR #${context.payload.pull_request.number}: ${targets.join(", ")}`);
            }

            core.setOutput("targets", JSON.stringify(targets));
            core.setOutput("has_targets", targets.length > 0 ? "true" : "false");

  run:
    needs: precheck
    if: ${{ needs.precheck.outputs.has_targets == 'true' }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.precheck.outputs.targets) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      backport_target_branch: ${{ matrix.target }}
      backport_commit_range: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
      job_name_suffix: ""
      run_frontend: true
      run_scala: true
      run_python: true
      run_agent_service: true
    secrets: inherit
