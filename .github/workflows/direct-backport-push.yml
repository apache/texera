name: Direct Backport Push

on:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  discover:
    name: Discover direct backport targets
    runs-on: ubuntu-latest
    outputs:
      push_entries: ${{ steps.discover.outputs.push_entries }}
      pr_entries: ${{ steps.discover.outputs.pr_entries }}
      has_push: ${{ steps.discover.outputs.has_push }}
      has_pr: ${{ steps.discover.outputs.has_pr }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Read release branches
        id: release_branches
        run: |
          entries=$(python3 .github/scripts/release_branches.py .github/release-branches.yml)
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "Release branches: ${entries}"
      - name: Resolve merged PRs and classify targets
        id: discover
        uses: actions/github-script@v9
        env:
          RELEASE_BRANCHES: ${{ steps.release_branches.outputs.entries }}
        with:
          script: |
            const sha = context.sha;
            const { owner, repo } = context.repo;

            // A push can carry several squash merges when auto-merges land on
            // main close together. Every commit in the push must be examined —
            // looking only at the head commit silently drops the release/*
            // labels of the other PRs in the same push (see #6119: #5802 and
            // #6111 were never backported this way).
            async function listPushCommits() {
              const before = context.payload?.before;
              const zeroSha = "0000000000000000000000000000000000000000";
              if (before && before !== zeroSha) {
                try {
                  // compareCommits returns the commits oldest-first, which is
                  // also the order the cherry-picks must apply in.
                  const { data: comparison } = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: before,
                    head: sha,
                  });
                  if (comparison.commits.length > 0) {
                    return comparison.commits.map((c) => ({
                      sha: c.sha,
                      message: c.commit.message,
                    }));
                  }
                  core.warning(`compare ${before}...${sha} returned no commits; falling back to the head commit.`);
                } catch (e) {
                  core.warning(`compare ${before}...${sha} failed: ${e.message}; falling back to the head commit.`);
                }
              }
              return [{ sha, message: context.payload?.head_commit?.message ?? "" }];
            }

            // Strategy 1 (preferred): parse the squash-merge commit message.
            // ASF .asf.yaml forces squash merges with PR_TITLE_AND_DESC, so the
            // first line ends with "(#NNNN)". This is deterministic and avoids
            // the commit↔PR association index, which can lag for tens of seconds
            // after a merge.
            async function resolvePrFromMessage(commit) {
              const firstLine = commit.message.split("\n", 1)[0];
              const match = firstLine.match(/\(#(\d+)\)\s*$/);
              if (!match) {
                core.info(`Message of ${commit.sha} does not end with "(#N)"; falling back to API.`);
                return null;
              }
              const prNumber = Number(match[1]);
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                if (!pr.merged) {
                  core.warning(`PR #${prNumber} extracted from ${commit.sha} is not merged; falling back to API.`);
                  return null;
                }
                core.info(`Resolved PR #${prNumber} from the message of ${commit.sha}.`);
                return pr;
              } catch (e) {
                core.warning(`Failed to fetch PR #${prNumber}: ${e.message}. Falling back to API.`);
                return null;
              }
            }

            // Strategy 2 (fallback): GET /commits/{sha}/pulls with exponential
            // backoff. 5 attempts at 0/2/4/8/16s — total worst case ~30s.
            async function resolvePrFromApi(commit) {
              const backoffsMs = [0, 2000, 4000, 8000, 16000];
              for (let i = 0; i < backoffsMs.length; i++) {
                if (backoffsMs[i] > 0) {
                  core.info(`Retrying commit→PR lookup in ${backoffsMs[i] / 1000}s (attempt ${i + 1}/${backoffsMs.length}).`);
                  await new Promise((resolve) => setTimeout(resolve, backoffsMs[i]));
                }
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls",
                  {
                    owner,
                    repo,
                    commit_sha: commit.sha,
                  }
                );
                const pr = response.data.find((p) => p.merge_commit_sha === commit.sha) ?? response.data[0];
                if (pr) {
                  core.info(`Resolved PR #${pr.number} from commits/${commit.sha}/pulls on attempt ${i + 1}.`);
                  return pr;
                }
              }
              return null;
            }

            // Collect the backport build legs for the PR head. They run in
            // Backport Checks now; during rollout, older PRs still have their
            // legs (and the old apply-check job) in Required Checks, so gather
            // jobs from both workflows.
            async function jobsForPr(pullRequest) {
              const workflowFiles = ["backport-checks.yml", "required-checks.yml"];
              const allJobs = [];
              for (const wf of workflowFiles) {
                let runs = [];
                try {
                  runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner,
                    repo,
                    workflow_id: wf,
                    head_sha: pullRequest.head.sha,
                    per_page: 100,
                  });
                } catch (e) {
                  core.info(`No ${wf} runs for ${pullRequest.head.sha} (${e.status ?? "?"}).`);
                  continue;
                }
                for (const run of runs) {
                  const jobs = await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    { owner, repo, run_id: run.id, per_page: 100 }
                  );
                  allJobs.push(...jobs);
                }
              }
              return allJobs;
            }

            // The apply-check outcome is now a published check run,
            // `backport-preflight (<target>)`: success = clean, neutral =
            // conflict. Read the PR head's check runs to find them.
            async function checkRunsForPr(pullRequest) {
              try {
                return await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: pullRequest.head.sha,
                  per_page: 100,
                });
              } catch (e) {
                core.warning(`listForRef ${pullRequest.head.sha} failed: ${e.message}`);
                return [];
              }
            }

            const isDone = (job) => job.status === "completed";
            // Skipped legs count as green: precheck legitimately skips stacks
            // by label; a real conflict shows up as an apply-check *failure*.
            const isGreen = (job) =>
              job.conclusion === "success" || job.conclusion === "skipped";

            // Classify each requested target into:
            //   push — safe to cherry-pick straight to the release branch: the
            //          pre-flight apply-check finished green AND no finished
            //          backport build leg failed.
            //   pr   — needs a human: the apply-check finished red (conflict)
            //          or a finished build leg failed (applies but won't build).
            //   skip — no *completed* signal (nothing ran, or the PR merged
            //          before the checks finished); acting on an in-progress
            //          job could push a conflict or open a spurious PR, so we
            //          leave it (the scheduled reconciliation, if any, or a
            //          re-push will pick it up once checks are done).
            function classifyTargets(allJobs, checkRuns, requestedTargets) {
              const push = [];
              const pr = [];
              for (const target of requestedTargets) {
                // Preferred apply signal: the published preflight check
                // (success = clean, neutral = conflict).
                const applyCheck = checkRuns.find(
                  (c) => c.name === `backport-preflight (${target})`
                );
                // Rollout fallback: PRs whose last run predates the split still
                // expose the old red/green apply-check job in Required Checks.
                const applyJob = allJobs.find(
                  (job) => job.name === `backport-apply-check (${target})`
                );
                const buildJobs = allJobs.filter((job) =>
                  job.name.startsWith(`backport (${target}) / `)
                );

                // Resolve the apply signal into clean | conflict | unknown.
                let apply = "unknown";
                if (applyCheck && applyCheck.status === "completed") {
                  if (applyCheck.conclusion === "success") apply = "clean";
                  else if (applyCheck.conclusion === "neutral") apply = "conflict";
                } else if (applyJob && isDone(applyJob)) {
                  apply = isGreen(applyJob) ? "clean" : "conflict";
                }

                if (apply === "conflict") {
                  pr.push(target); // cherry-pick conflicts
                  continue;
                }
                if (buildJobs.some((job) => isDone(job) && !isGreen(job))) {
                  pr.push(target); // applies but does not build
                  continue;
                }

                const anyBuildDone = buildJobs.some(isDone);
                // Normal path: apply finished clean. The `unknown` + build-legs
                // clause keeps older runs (before the apply signal existed)
                // working off the build legs alone during rollout.
                if (apply === "clean" || (apply === "unknown" && anyBuildDone)) {
                  push.push(target);
                } else {
                  core.warning(`PR: no completed backport signal for ${target}; skipping.`);
                }
              }
              return { push, pr };
            }

            const releaseManagers = new Map(
              JSON.parse(process.env.RELEASE_BRANCHES || "[]").map((e) => [
                e.branch,
                e.manager || "",
              ])
            );

            const commits = await listPushCommits();
            core.info(`Push contains ${commits.length} commit(s).`);

            // push_entries: (PR, target) pairs cherry-picked straight to the
            //   release branch, in commit order.
            // pr_entries: (PR, target, manager) pairs that get an auto-opened
            //   draft backport PR for the author to finish.
            const pushEntries = [];
            const prEntries = [];
            const seenPrNumbers = new Set();
            for (const commit of commits) {
              const pullRequest =
                (await resolvePrFromMessage(commit)) ?? (await resolvePrFromApi(commit));
              if (!pullRequest) {
                core.info(`No merged pull request is associated with ${commit.sha}.`);
                continue;
              }
              if (seenPrNumbers.has(pullRequest.number)) {
                continue;
              }
              seenPrNumbers.add(pullRequest.number);

              const labelNames = pullRequest.labels.map((label) => label.name);
              if (labelNames.includes("no-backport-needed")) {
                core.info(`PR #${pullRequest.number} has no-backport-needed; skipping.`);
                continue;
              }

              const requestedTargets = [...new Set(
                labelNames.filter((name) => /^release\/.+$/.test(name))
              )].sort();

              if (requestedTargets.length === 0) {
                core.info(`PR #${pullRequest.number} does not request any backports.`);
                continue;
              }

              const allJobs = await jobsForPr(pullRequest);
              const checkRuns = await checkRunsForPr(pullRequest);
              const { push, pr } = classifyTargets(allJobs, checkRuns, requestedTargets);
              core.info(
                `PR #${pullRequest.number}: push=[${push.join(", ")}] pr=[${pr.join(", ")}]`
              );

              // Both outcomes now open a pull request. Pushing a cherry-pick
              // straight onto a release branch is rejected by the Merge Queue
              // ruleset that covers them (#8377), and ASF policy requires prior
              // Infrastructure authorization for an automated service to push
              // to a branch subject to official release — so the fix travels
              // the way every other change to a release branch travels.
              //
              // The two are not the same PR, though: a clean cherry-pick needs
              // nobody to touch it, so it opens ready for review with
              // auto-merge armed and the manager's approval is the only step
              // left. A conflicted one still opens as a draft for its author.
              for (const target of push) {
                prEntries.push({
                  pr_number: pullRequest.number,
                  merge_sha: commit.sha,
                  target,
                  manager: releaseManagers.get(target) || "",
                  clean: "true",
                });
              }
              for (const target of pr) {
                prEntries.push({
                  pr_number: pullRequest.number,
                  merge_sha: commit.sha,
                  target,
                  manager: releaseManagers.get(target) || "",
                  clean: "false",
                });
              }
            }

            core.info(`Push entries: ${JSON.stringify(pushEntries)}`);
            core.info(`PR entries: ${JSON.stringify(prEntries)}`);
            // Always empty now: every target opens a PR. The push-backports
            // job below is therefore unreachable and is removed separately, so
            // that this change is a behaviour change and that one is a pure
            // deletion.
            core.setOutput("push_entries", JSON.stringify(pushEntries));
            core.setOutput("pr_entries", JSON.stringify(prEntries));
            core.setOutput("has_push", pushEntries.length > 0 ? "true" : "false");
            core.setOutput("has_pr", prEntries.length > 0 ? "true" : "false");

  push-backports:
    needs: discover
    if: ${{ needs.discover.outputs.has_push == 'true' }}
    runs-on: ubuntu-latest
    name: "backport #${{ matrix.pr_number }} to ${{ matrix.target }}"
    strategy:
      fail-fast: false
      # One leg per (PR, target) pair. max-parallel: 1 applies cherry-picks
      # in commit order and keeps two legs from racing pushes to the same
      # release branch.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.push_entries) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use AUTO_MERGE_TOKEN (fine-grained PAT) so the push to the release
          # branch retriggers workflows on that branch. GITHUB_TOKEN-authored
          # pushes are excluded from triggering downstream workflows, which
          # silences post-merge CI on backport commits.
          token: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Cherry-pick merge commit onto target branch
        id: cherry_pick
        env:
          MERGE_SHA: ${{ matrix.merge_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
        run: |
          set -euo pipefail

          log() { printf '[backport %s] %s\n' "${TARGET_BRANCH}" "$*"; }
          group() { printf '::group::%s\n' "$*"; }
          endgroup() { printf '::endgroup::\n'; }

          group "Validate merge commit ${MERGE_SHA}"
          parent_count=$(git rev-list --parents -n 1 "${MERGE_SHA}" | awk '{print NF-1}')
          log "parent_count=${parent_count}"
          if [[ "${parent_count}" -ne 1 ]]; then
            echo "::error::Direct backport expects a squash-merged commit on main. ${MERGE_SHA} has ${parent_count} parents."
            exit 1
          fi
          endgroup

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reuse the squash commit's full message so the PR title, description,
          # and any Co-Authored-By trailers GitHub injected stay attached to
          # the backport commit. The author is the squash commit's author
          # (the original PR author for squash merges).
          original_author=$(git log -1 --format='%an <%ae>' "${MERGE_SHA}")
          merge_message=$(git log -1 --format=%B "${MERGE_SHA}")
          log "original_author=${original_author}"

          group "Cherry-pick onto ${TARGET_BRANCH}"
          git fetch --no-tags origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          base_sha=$(git rev-parse HEAD)
          log "base_sha=${base_sha}"
          # Rename-detection knobs kept identical to prepare-backport-checkout.sh
          # (the preflight) so a rename resolved cleanly there does not conflict
          # here on the straight-to-release cherry-pick. See that script for the
          # rationale behind each setting.
          if ! git -c merge.renameLimit=999999 \
                   -c diff.renameLimit=999999 \
                   -c merge.directoryRenames=true \
                   cherry-pick -Xrename-threshold=40% --no-commit "${MERGE_SHA}"; then
            endgroup
            group "Conflict diagnosis"
            conflicts=$(git diff --name-only --diff-filter=U)
            log "Conflicted files:"
            printf '  %s\n' ${conflicts}

            # merge-base of the source commit and the target branch — the
            # most recent point where main and the release branch shared
            # history. Anything on main between the merge-base and the
            # source commit that touches a conflicting file is a candidate
            # "missing prerequisite" the backport probably needs first.
            merge_base=$(git merge-base "${MERGE_SHA}^" "origin/${TARGET_BRANCH}" || echo "")
            log ""
            log "merge_base(${MERGE_SHA:0:8}^, origin/${TARGET_BRANCH})=${merge_base:-<none>}"

            for f in ${conflicts}; do
              log ""
              log "── ${f} ──"
              log "Conflict markers (line numbers in the working tree):"
              grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- "${f}" | head -40 || true

              if [[ -n "${merge_base}" ]]; then
                log ""
                log "Commits on main that modified ${f} between ${merge_base:0:8}..${MERGE_SHA:0:8}^ (likely-missing prerequisites — consider backporting these first):"
                git log --oneline --no-merges "${merge_base}..${MERGE_SHA}^" -- "${f}" | head -20 || true

                log ""
                log "Commits on ${TARGET_BRANCH} that modified ${f} since ${merge_base:0:8} (changes already on the release branch that diverged from main):"
                git log --oneline --no-merges "${merge_base}..origin/${TARGET_BRANCH}" -- "${f}" | head -20 || true
              fi

              log ""
              log "Last 3 commits anywhere that touched ${f}:"
              git log --oneline --all -3 -- "${f}" || true
            done
            endgroup

            # Write a condensed markdown summary for the failure PR comment.
            # Caps: 5 files, 10 prerequisite commits total — keep PR
            # comments scannable; the full detail is in the job log above.
            diagnosis_file="${RUNNER_TEMP:-/tmp}/backport-diagnosis.md"
            {
              echo "**Conflicts in:**"
              num=0
              for f in ${conflicts}; do
                if [[ ${num} -lt 5 ]]; then
                  printf -- '- `%s`\n' "${f}"
                fi
                num=$((num + 1))
              done
              if [[ ${num} -gt 5 ]]; then
                printf -- '- _(+%d more)_\n' "$((num - 5))"
              fi
              if [[ -n "${merge_base}" ]]; then
                echo
                echo "**Likely-missing prerequisites on main** (commits that touched these files between merge-base \`${merge_base:0:8}\` and \`${MERGE_SHA:0:8}^\` — consider backporting these first):"
                {
                  for f in ${conflicts}; do
                    git log --oneline --no-merges "${merge_base}..${MERGE_SHA}^" -- "${f}" || true
                  done
                } | sort -u | head -10 | while IFS= read -r line; do
                  [[ -n "${line}" ]] && printf -- '- `%s`\n' "${line}"
                done
              fi
            } > "${diagnosis_file}"
            log "Wrote diagnosis summary to ${diagnosis_file}"

            echo "::error::Cherry-pick of ${MERGE_SHA} onto ${TARGET_BRANCH} hit conflicts. See 'Conflict diagnosis' group above for likely-missing prerequisite commits and per-file conflict markers."
            exit 1
          fi
          endgroup

          group "Compose backport commit message"
          new_message=$(
            printf '%s' "${merge_message}" \
              | python3 .github/scripts/compose-backport-message.py "${MERGE_SHA}"
          )
          printf '%s\n' "${new_message}" | git commit -F - --author="${original_author}"
          log "local_sha=$(git rev-parse HEAD)"
          endgroup

          # Push with retry. Transient failures (network, GitHub 5xx) are pure
          # backoff. Non-fast-forward (race with another push to the same
          # release branch) refreshes origin/<target> and rebases this single
          # cherry-pick on top before retrying.
          push_attempts=5
          push_backoffs=(0 5 15 30 60)
          push_success=0
          for i in $(seq 0 $((push_attempts - 1))); do
            if [[ "${push_backoffs[i]}" -gt 0 ]]; then
              log "Push attempt $((i + 1))/${push_attempts}: sleeping ${push_backoffs[i]}s"
              sleep "${push_backoffs[i]}"
            fi
            group "Push attempt $((i + 1))/${push_attempts}"
            if git push origin "HEAD:${TARGET_BRANCH}" 2>&1; then
              push_success=1
              endgroup
              break
            fi
            push_rc=$?
            log "git push exit code=${push_rc}"
            endgroup

            # Refresh origin and rebase before retrying. If the remote did not
            # advance, this is a no-op rebase and the next push will likely
            # hit the same transient error — backoff handles that.
            log "Refreshing origin/${TARGET_BRANCH} before retry"
            git fetch --no-tags origin "${TARGET_BRANCH}"
            old_remote_head="${remote_head:-${base_sha}}"
            remote_head=$(git rev-parse "origin/${TARGET_BRANCH}")
            log "origin/${TARGET_BRANCH}=${remote_head}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              conflicts=$(git diff --name-only --diff-filter=U)
              group "Rebase conflict diagnosis"
              log "Conflicted files during rebase:"
              printf '  %s\n' ${conflicts}
              log ""
              log "Commits on ${TARGET_BRANCH} that landed since this run started (${old_remote_head:0:8}..${remote_head:0:8}):"
              git log --oneline --no-merges "${old_remote_head}..${remote_head}" | head -20 || true
              for f in ${conflicts}; do
                log ""
                log "── ${f} ──"
                log "Commits in ${old_remote_head:0:8}..${remote_head:0:8} that touched ${f}:"
                git log --oneline --no-merges "${old_remote_head}..${remote_head}" -- "${f}" | head -20 || true
              done
              endgroup

              diagnosis_file="${RUNNER_TEMP:-/tmp}/backport-diagnosis.md"
              {
                printf -- '**Rebase conflict during push** — another commit landed on `%s` between the start of this run and the push attempt.\n\n' "${TARGET_BRANCH}"
                echo "**Conflicts in:**"
                num=0
                for f in ${conflicts}; do
                  if [[ ${num} -lt 5 ]]; then
                    printf -- '- `%s`\n' "${f}"
                  fi
                  num=$((num + 1))
                done
                if [[ ${num} -gt 5 ]]; then
                  printf -- '- _(+%d more)_\n' "$((num - 5))"
                fi
                echo
                printf -- '**Racing commits on `%s`** (`%s..%s`):\n' \
                  "${TARGET_BRANCH}" "${old_remote_head:0:8}" "${remote_head:0:8}"
                git log --oneline --no-merges "${old_remote_head}..${remote_head}" | head -10 | while IFS= read -r line; do
                  [[ -n "${line}" ]] && printf -- '- `%s`\n' "${line}"
                done
              } > "${diagnosis_file}"
              log "Wrote diagnosis summary to ${diagnosis_file}"

              git rebase --abort || true
              echo "::error::Rebase onto refreshed origin/${TARGET_BRANCH} hit a conflict; another commit changed the same lines. See 'Rebase conflict diagnosis' group for the racing commits."
              exit 1
            fi
          done

          if [[ "${push_success}" -ne 1 ]]; then
            echo "::error::git push to ${TARGET_BRANCH} failed after ${push_attempts} attempts"
            exit 1
          fi

          new_sha=$(git rev-parse HEAD)
          log "new_sha=${new_sha}"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"

      - name: Annotate original PR and commit on success
        if: success()
        uses: actions/github-script@v9
        env:
          MERGE_SHA: ${{ matrix.merge_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          NEW_SHA: ${{ steps.cherry_pick.outputs.new_sha }}
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const { MERGE_SHA, TARGET_BRANCH, NEW_SHA, PR_NUMBER } = process.env;
            const { owner, repo } = context.repo;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const newCommitUrl =
              `${context.serverUrl}/${owner}/${repo}/commit/${NEW_SHA}`;
            const branchUrl =
              `${context.serverUrl}/${owner}/${repo}/tree/${TARGET_BRANCH}`;

            core.info(
              `Annotating: merge_sha=${MERGE_SHA} new_sha=${NEW_SHA} ` +
              `target=${TARGET_BRANCH} pr=${PR_NUMBER || '<unknown>'}`,
            );

            // Annotation API calls are best-effort: a transient 5xx shouldn't
            // demote the whole job to failure when the cherry-pick itself
            // succeeded. Each call gets a small bounded retry; if it still
            // fails we log a warning and move on so the other annotations
            // still get a chance to land.
            const backoffsMs = [0, 2000, 5000, 15000];
            async function withRetry(name, fn) {
              for (let i = 0; i < backoffsMs.length; i++) {
                if (backoffsMs[i] > 0) {
                  core.info(
                    `Retrying ${name} in ${backoffsMs[i] / 1000}s ` +
                    `(attempt ${i + 1}/${backoffsMs.length}).`,
                  );
                  await new Promise((r) => setTimeout(r, backoffsMs[i]));
                }
                try {
                  const out = await fn();
                  core.info(`${name} ok.`);
                  return out;
                } catch (e) {
                  const msg = `${name} failed (status ${e.status ?? '?'}): ${e.message}`;
                  if (i === backoffsMs.length - 1) {
                    core.warning(`${msg} — giving up.`);
                    return null;
                  }
                  core.warning(`${msg} — will retry.`);
                }
              }
            }

            // GitHub auto-derives the branch badges shown next to a commit
            // title from "branches that contain this commit". A cherry-pick
            // produces a different SHA than the main commit, so the release
            // branch will never naturally appear on the main commit's page.
            // Two surfacing channels instead:
            //   1. A commit status — appears as a green check badge in the
            //      same row as CI statuses on the commit and any PRs that
            //      reference it. target_url drops the user on the new commit.
            //   2. A commit comment with the same info, for richer detail.
            await withRetry("createCommitStatus", () =>
              github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: MERGE_SHA,
                state: "success",
                context: `backport/${TARGET_BRANCH}`,
                description: `Backported as ${NEW_SHA.slice(0, 7)}`,
                target_url: newCommitUrl,
              }),
            );

            await withRetry("createCommitComment", () =>
              github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: MERGE_SHA,
                body:
                  `Backported to [\`${TARGET_BRANCH}\`](${branchUrl}) as ` +
                  `[\`${NEW_SHA.slice(0, 7)}\`](${newCommitUrl}). ` +
                  `[Run](${runUrl})`,
              }),
            );

            if (PR_NUMBER) {
              await withRetry("createPRComment", () =>
                github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(PR_NUMBER),
                  body:
                    `Backport to [\`${TARGET_BRANCH}\`](${branchUrl}) succeeded ` +
                    `as [\`${NEW_SHA.slice(0, 7)}\`](${newCommitUrl}). ` +
                    `[Run](${runUrl})`,
                }),
              );
            } else {
              core.info("No PR number resolved — skipping PR comment.");
            }

      - name: Annotate original PR and commit on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          MERGE_SHA: ${{ matrix.merge_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const { MERGE_SHA, TARGET_BRANCH, PR_NUMBER } = process.env;
            const { owner, repo } = context.repo;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            core.info(
              `Annotating failure: merge_sha=${MERGE_SHA} ` +
              `target=${TARGET_BRANCH} pr=${PR_NUMBER || '<unknown>'}`,
            );

            const backoffsMs = [0, 2000, 5000, 15000];
            async function withRetry(name, fn) {
              for (let i = 0; i < backoffsMs.length; i++) {
                if (backoffsMs[i] > 0) {
                  core.info(
                    `Retrying ${name} in ${backoffsMs[i] / 1000}s ` +
                    `(attempt ${i + 1}/${backoffsMs.length}).`,
                  );
                  await new Promise((r) => setTimeout(r, backoffsMs[i]));
                }
                try {
                  const out = await fn();
                  core.info(`${name} ok.`);
                  return out;
                } catch (e) {
                  const msg = `${name} failed (status ${e.status ?? '?'}): ${e.message}`;
                  if (i === backoffsMs.length - 1) {
                    core.warning(`${msg} — giving up.`);
                    return null;
                  }
                  core.warning(`${msg} — will retry.`);
                }
              }
            }

            // Find this matrix leg's job so the link drops the user directly
            // onto the failing log instead of the run summary.
            let jobUrl = runUrl;
            const jobs = await withRetry("listJobsForWorkflowRun", () =>
              github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              }),
            );
            if (jobs) {
              const me = jobs.find(
                (j) => j.name.includes(`#${PR_NUMBER} `) && j.name.includes(TARGET_BRANCH),
              );
              if (me?.html_url) {
                jobUrl = me.html_url;
                core.info(`Resolved job URL for matrix leg: ${jobUrl}`);
              } else {
                core.info(
                  `No job matched name including "#${PR_NUMBER}" and "${TARGET_BRANCH}"; ` +
                  "falling back to run URL.",
                );
              }
            }

            await withRetry("createCommitStatus", () =>
              github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: MERGE_SHA,
                state: "failure",
                context: `backport/${TARGET_BRANCH}`,
                description: "Backport failed",
                target_url: jobUrl,
              }),
            );

            // Pick up the markdown diagnosis the bash step wrote on
            // conflict (cherry-pick or rebase). Missing file just means
            // the failure happened elsewhere (e.g. push 5xx after retries,
            // permissions) — we still post the basic comment.
            const fs = require("fs");
            const diagPath =
              `${process.env.RUNNER_TEMP || "/tmp"}/backport-diagnosis.md`;
            let diagnosis = "";
            try {
              diagnosis = fs.readFileSync(diagPath, "utf8").trim();
              if (diagnosis) {
                core.info(`Found diagnosis at ${diagPath} (${diagnosis.length} chars)`);
              }
            } catch (e) {
              core.info(
                `No diagnosis file at ${diagPath} (${e.code}) — failure likely not a conflict.`,
              );
            }

            if (PR_NUMBER) {
              const head =
                `Backport to \`${TARGET_BRANCH}\` failed. ` +
                `See [job log](${jobUrl}).`;
              const body = diagnosis ? `${head}\n\n${diagnosis}` : head;
              await withRetry("createPRComment", () =>
                github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(PR_NUMBER),
                  body,
                }),
              );
            } else {
              core.info("No PR number resolved — skipping PR comment.");
            }

  open-backport-pr:
    needs: discover
    if: ${{ needs.discover.outputs.has_pr == 'true' }}
    runs-on: ubuntu-latest
    name: "backport PR #${{ matrix.pr_number }} to ${{ matrix.target }}"
    strategy:
      fail-fast: false
      # One at a time, as push-backports did: a single push can carry several
      # fixes for the same release branch, and each cherry-pick is taken against
      # that branch as it stands, so preparing them concurrently would race
      # their branches against each other. Merge order is then the merge
      # queue's to keep, which is what it is for.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.pr_entries) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # AUTO_MERGE_TOKEN so the pushed branch and the opened PR retrigger
          # CI on the release branch (GITHUB_TOKEN-authored pushes/PRs do not).
          token: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create backport branch
        id: branch
        env:
          MERGE_SHA: ${{ matrix.merge_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          bash ./.github/scripts/create-backport-branch.sh \
            "${MERGE_SHA}" "${TARGET_BRANCH}" "${PR_NUMBER}"
      - name: Open backport PR
        id: open
        uses: actions/github-script@v9
        env:
          MERGE_SHA: ${{ matrix.merge_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          PR_NUMBER: ${{ matrix.pr_number }}
          MANAGER: ${{ matrix.manager }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.branch.outputs.version }}
          HAD_CONFLICT: ${{ steps.branch.outputs.had_conflict }}
          CONFLICT_FILES: ${{ steps.branch.outputs.conflict_files }}
          SUBJECT: ${{ steps.branch.outputs.subject }}
          FEATURE_ABSENT: ${{ steps.branch.outputs.feature_absent }}
          CLEAN: ${{ matrix.clean }}
        with:
          # Opened as github-actions[bot], for both outcomes. GitHub suppresses
          # workflow runs for anything GITHUB_TOKEN does, so a clean backport's
          # required checks are started by the step below rather than by this
          # creation — see the comment there.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {
              MERGE_SHA, TARGET_BRANCH, PR_NUMBER, MANAGER,
              BRANCH, VERSION, HAD_CONFLICT, CONFLICT_FILES, SUBJECT,
              FEATURE_ABSENT, CLEAN,
            } = process.env;
            const { owner, repo } = context.repo;
            const prNumber = Number(PR_NUMBER);
            const hadConflict = HAD_CONFLICT === "true";
            // Clean means the cherry-pick applied and the backported tree built
            // green before the merge: nothing here needs a human's hands, only
            // the release manager's confirmation.
            //
            // CLEAN carries the pre-merge preflight's verdict, but the branch
            // step above cherry-picked again just now, onto a release branch
            // that may have moved since. Trust that fresher result too, or a
            // race would open a tree full of conflict markers ready for review,
            // call it conflict-free, and arm auto-merge on it.
            const clean = CLEAN === "true" && !hadConflict;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // The branch step skipped this target: the fix changes only files
            // that don't exist on the release branch, so there is nothing to
            // backport. Record it on the original PR instead of opening a PR.
            if (FEATURE_ABSENT === "true") {
              core.info(`Feature absent on ${TARGET_BRANCH}; not opening a backport PR.`);
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body:
                    `Not backported to \`${TARGET_BRANCH}\`: the files this fix ` +
                    `changes do not exist there (the feature is not on that ` +
                    `release). Add \`no-backport-needed\` to silence this for ` +
                    `future targets.`,
                });
              } catch (e) {
                core.warning(`Could not comment on #${prNumber}: ${e.message}`);
              }
              try {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: MERGE_SHA, state: "success",
                  context: `backport/${TARGET_BRANCH}`,
                  description: "Skipped: feature not on release branch",
                });
              } catch (e) {
                core.warning(`Could not set commit status: ${e.message}`);
              }
              return;
            }

            // Inject the release version into the conventional-commit scope so
            // the backport PR reads e.g. `fix(amber, v1.2): ...`. Falls back to
            // suffixing the version if the subject is not conventional.
            function backportTitle(subject, version) {
              // Drop the trailing "(#N)" GitHub appends to the squash subject
              // so the backport title does not render as a link back to the
              // original PR.
              const clean = subject.replace(/\s*\(#\d+\)\s*$/, "");
              const m = clean.match(/^(\w+)(?:\(([^)]*)\))?(!)?:\s*(.*)$/);
              if (!m) return `${clean} (${version})`;
              const [, type, scope, bang, rest] = m;
              const newScope = scope ? `${scope}, ${version}` : version;
              return `${type}(${newScope})${bang || ""}: ${rest}`;
            }
            const title = backportTitle(SUBJECT, VERSION);

            // Idempotency: on a re-run the branch is force-pushed, so an open
            // PR from the same head already reflects the new commit — don't
            // open a duplicate.
            const existing = await github.rest.pulls.list({
              owner, repo, state: "open", head: `${owner}:${BRANCH}`,
            });
            let pr = existing.data[0];
            if (pr) {
              core.info(`Backport PR already open: #${pr.number}; not duplicating.`);
              // The branch name is deterministic and force-pushed, so a re-run
              // can find a PR whose draft state no longer matches what this
              // cherry-pick produced. Leaving it would strand a now-clean
              // backport as a draft, which auto-merge cannot be armed on, or
              // leave a now-conflicted one ready for review with conflict
              // markers in it. Draft state is GraphQL-only.
              if (pr.draft === clean) {
                try {
                  await github.graphql(
                    clean
                      ? `mutation ($id: ID!) {
                          markPullRequestReadyForReview(input: { pullRequestId: $id })
                          { clientMutationId }
                        }`
                      : `mutation ($id: ID!) {
                          convertPullRequestToDraft(input: { pullRequestId: $id })
                          { clientMutationId }
                        }`,
                    { id: pr.node_id }
                  );
                  core.info(
                    `Re-run moved #${pr.number} to ${clean ? "ready" : "draft"}.`
                  );
                } catch (e) {
                  core.warning(
                    `Could not move #${pr.number} to ${clean ? "ready" : "draft"}: ${e.message}`
                  );
                }
              }
            } else {
              const conflictList = CONFLICT_FILES.trim()
                ? CONFLICT_FILES.trim().split(/\s+/).map((f) => `- \`${f}\``).join("\n")
                : "";
              const statusLine = clean
                ? `**Clean cherry-pick — nothing here was edited by hand.** It applied to ` +
                  `\`${TARGET_BRANCH}\` without conflicts, and the backported tree built ` +
                  `green before #${prNumber} merged.\n\n` +
                  `${MANAGER ? `@${MANAGER} already approved #${prNumber} for this branch; ` +
                    `this PR carries that decision out. ` : ""}` +
                  `**Auto-merge is armed** — an approving review is the only thing between ` +
                  `this and \`${TARGET_BRANCH}\`.`
                : hadConflict
                ? `The cherry-pick **conflicted** and was committed with conflict markers. ` +
                  `Resolve the conflicts on this branch, then mark this PR ready for review.`
                : `The cherry-pick applied cleanly but the backported tree failed its ` +
                  `pre-merge build. Fix the build on this branch, then mark this PR ready for review.`;

              // Carry the original PR's linked issues (its GitHub-linked
              // closing references) and any discussion / mailing-list links
              // into the backport so the release-branch reviewer has the same
              // context. Plain `#N` mentions, never `Closes` — the backport
              // must not re-close an issue the original PR already resolved.
              let relatedSection = `Backport of #${prNumber}.`;
              try {
                const linked = await github.graphql(
                  `query ($owner: String!, $repo: String!, $num: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $num) {
                        body
                        closingIssuesReferences(first: 20) { nodes { number } }
                      }
                    }
                  }`,
                  { owner, repo, num: prNumber }
                );
                const original = linked.repository.pullRequest;
                const bodyText = original.body || "";
                const issues = (original.closingIssuesReferences?.nodes || []).map(
                  (n) => n.number
                );
                const discussions = [
                  ...bodyText.matchAll(
                    /https:\/\/(?:github\.com\/[^\s)]+\/discussions\/\d+|lists\.apache\.org\/[^\s)]+)/g
                  ),
                ].map((m) => m[0]);
                // Security dependency PRs (e.g. Renovate) usually link no issue;
                // fall back to the CVE / GHSA advisories named in the body so
                // the backport still points at what it fixes.
                const cves = [
                  ...new Set([...bodyText.matchAll(/\bCVE-\d{4}-\d{4,7}\b/g)].map((m) => m[0])),
                ];
                const ghsas = [
                  ...new Set(
                    [...bodyText.matchAll(/\bGHSA(?:-[a-z0-9]{4}){3}\b/gi)].map((m) => m[0])
                  ),
                ];
                const advisories = cves.length ? cves : ghsas;
                const parts = [`Backport of #${prNumber}.`];
                if (issues.length) {
                  parts.push(`Originally linked ${issues.map((n) => `#${n}`).join(", ")}.`);
                } else if (advisories.length) {
                  parts.push(`Fixes ${advisories.join(", ")} (see #${prNumber} for details).`);
                }
                parts.push(...discussions);
                relatedSection = parts.join(" ");
              } catch (e) {
                core.warning(`Could not read linked issues from #${prNumber}: ${e.message}`);
              }

              const body = [
                `### What changes were proposed in this PR?`,
                ``,
                `Automated backport of #${prNumber} to \`${TARGET_BRANCH}\`.`,
                ``,
                `Source: ${MERGE_SHA} · [automation run](${runUrl})`,
                ``,
                `### Any related issues, documentation, discussions?`,
                ``,
                relatedSection,
                ``,
                `### How was this PR tested?`,
                ``,
                clean
                  ? `The backported tree built green before #${prNumber} merged, and ` +
                    `release-branch CI runs on this PR as well — auto-merge waits for it.`
                  : `Release-branch CI runs on this branch once the ` +
                    `${hadConflict ? "conflicts are resolved" : "build is fixed"} and ` +
                    `this PR is marked ready for review.`,
                ``,
                `### Was this PR authored or co-authored using generative AI tooling?`,
                ``,
                `No.`,
              ].join("\n");

              pr = (await github.rest.pulls.create({
                owner, repo, base: TARGET_BRANCH, head: BRANCH,
                title, body, draft: !clean,
              })).data;
              core.info(
                `Opened ${clean ? "ready" : "draft"} backport PR #${pr.number}.`
              );

              // A clean one still needs its checks started and auto-merge
              // armed; both happen in the next step, which holds a token that
              // can trigger workflows.

              // Post the how-to-finish instructions as a comment on the new
              // backport PR (kept out of the templated body).
              const statusComment = conflictList
                ? `${statusLine}\n\n**Conflicting files:**\n${conflictList}`
                : statusLine;
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body: statusComment,
                });
              } catch (e) {
                core.warning(`Could not comment on backport PR #${pr.number}: ${e.message}`);
              }
            }

            // Assign the original author (best-effort: external authors may not
            // be assignable) and label the PR with the target branch.
            let author = "";
            try {
              author = (await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              })).data.user?.login || "";
            } catch (e) {
              core.warning(`Could not fetch PR #${prNumber} author: ${e.message}`);
            }
            if (author) {
              try {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: pr.number, assignees: [author],
                });
              } catch (e) {
                core.warning(`Could not assign ${author}: ${e.message}`);
              }
            }
            if (MANAGER && MANAGER !== author) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: pr.number, reviewers: [MANAGER],
                });
              } catch (e) {
                core.warning(`Could not request review from ${MANAGER}: ${e.message}`);
              }
            }

            // Link the backport PR back from the original PR so it is not lost.
            const prUrl = `${context.serverUrl}/${owner}/${repo}/pull/${pr.number}`;
            const reason = hadConflict
              ? "the cherry-pick conflicts"
              : "the backported tree failed its pre-merge build";
            try {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: clean
                  ? `Backport PR opened: #${pr.number} (${prUrl}) to ` +
                    `\`${TARGET_BRANCH}\` — the cherry-pick was clean, so it is ` +
                    `ready for review with auto-merge armed` +
                    (MANAGER ? `, waiting on @${MANAGER}'s approval` : "") + `.`
                  : `Backport PR opened: draft #${pr.number} (${prUrl}) to ` +
                    `\`${TARGET_BRANCH}\`` +
                    (author ? `, assigned to @${author}` : "") +
                    ` — needs manual work because ${reason}.`,
              });
            } catch (e) {
              core.warning(`Could not comment on #${prNumber}: ${e.message}`);
            }

            // A failure commit status on the merge commit keeps the "needs
            // backport" signal visible on main next to the successful ones.
            try {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: MERGE_SHA,
                // A clean backport is on its way — but not yet: the next step
                // still has to start its checks and arm auto-merge, and either
                // can fail. Say pending until it does and let that step settle
                // it, rather than claiming a success this cannot yet see. Only
                // the ones needing hands carry the red signal from here.
                state: clean ? "pending" : "failure",
                context: `backport/${TARGET_BRANCH}`,
                description: clean
                  ? `Backport PR #${pr.number} open, starting its checks`
                  : `Draft backport PR #${pr.number} opened`,
                target_url: prUrl,
              });
            } catch (e) {
              core.warning(`Could not set commit status: ${e.message}`);
            }

            // Handed to the step below, which starts this PR's checks and arms
            // auto-merge — both need a token that can trigger workflows.
            if (clean) core.setOutput("clean_pr", String(pr.number));

      # GitHub suppresses workflow runs for anything GITHUB_TOKEN does, so the
      # pull request opened above starts with no checks at all. A conflicted one
      # does not care: it is a draft, and CI fires when its author pushes a
      # resolution. A clean one has nobody to push anything, so its three
      # required contexts would never appear and auto-merge would wait on them
      # forever — the backport would look like it was progressing while sitting
      # still.
      #
      # Closing and reopening it under a token that can trigger workflows emits
      # `pull_request: reopened`, which Required Checks, Check License Headers
      # and Validate PR title all subscribe to. The pull request keeps
      # github-actions[bot] as its author; only these two events carry the
      # token owner's name.
      - name: Start checks and arm auto-merge
        if: ${{ matrix.clean == 'true' && steps.open.outputs.clean_pr }}
        uses: actions/github-script@v9
        env:
          CLEAN_PR: ${{ steps.open.outputs.clean_pr }}
          ORIGINAL_PR: ${{ matrix.pr_number }}
          TARGET_BRANCH: ${{ matrix.target }}
          MERGE_SHA: ${{ matrix.merge_sha }}
        with:
          # No GITHUB_TOKEN fallback on purpose: GitHub suppresses the workflow
          # runs a GITHUB_TOKEN close/reopen would emit, so falling back would
          # let this step report success while the three required contexts were
          # never created — a backport that waits forever and looks fine. With
          # the secret missing this fails visibly instead.
          github-token: ${{ secrets.AUTO_MERGE_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.CLEAN_PR);
            const originalPr = Number(process.env.ORIGINAL_PR);
            const TARGET_BRANCH = process.env.TARGET_BRANCH;
            const MERGE_SHA = process.env.MERGE_SHA;
            const prUrl = `${context.serverUrl}/${owner}/${repo}/pull/${number}`;

            // The step that opened this PR left `backport/<branch>` pending on
            // the merge commit, because whether the backport is actually moving
            // is decided here. Settle it before returning, on every path.
            async function settle(state, description) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: MERGE_SHA, state,
                  context: `backport/${TARGET_BRANCH}`,
                  description, target_url: prUrl,
                });
              } catch (e) {
                core.warning(`Could not settle the backport status: ${e.message}`);
              }
            }

            async function setState(state) {
              await github.rest.pulls.update({
                owner, repo, pull_number: number, state,
              });
            }

            // Reopening is the half that must not be lost: a backport left
            // closed is a fix silently dropped, which is worse than the
            // no-checks state this is fixing. Retry it, and if it still fails
            // say so on the original PR and fail the job rather than leaving a
            // closed pull request nobody is looking at.
            await setState("closed");
            let reopened = false;
            for (const waitMs of [0, 3000, 10000]) {
              if (waitMs) await new Promise((r) => setTimeout(r, waitMs));
              try {
                await setState("open");
                reopened = true;
                break;
              } catch (e) {
                core.warning(`Reopening #${number} failed: ${e.message}`);
              }
            }

            if (!reopened) {
              await settle("failure", `Backport PR #${number} closed, needs reopening`);
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: originalPr,
                  body:
                    `The backport PR for \`${TARGET_BRANCH}\` (#${number}, ${prUrl}) ` +
                    `was closed to start its checks and could not be reopened. ` +
                    `**Reopen it by hand** — the branch and the commit are intact.`,
                });
              } catch (e) {
                core.warning(`Could not comment on #${originalPr}: ${e.message}`);
              }
              core.setFailed(
                `Closed #${number} to start its checks but could not reopen it.`
              );
              return;
            }
            core.info(`Reopened #${number}; its required checks now run.`);

            // Arm auto-merge after the reopen, so the manager's approval is the
            // last human step and the merge queue takes it from there. Squash
            // is the only method these branches allow.
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              await github.graphql(
                `mutation ($id: ID!) {
                  enablePullRequestAutoMerge(
                    input: { pullRequestId: $id, mergeMethod: SQUASH }
                  ) { clientMutationId }
                }`,
                { id: pr.node_id }
              );
              core.info(`Auto-merge armed on #${number}.`);
              await settle("success", `Backport PR #${number} open, auto-merge armed`);
            } catch (e) {
              // Not fatal: the pull request stands and can be merged by hand.
              // But its opening comment already told the reviewer auto-merge was
              // armed, so correct that where the claim was made — otherwise they
              // approve and wait for a merge that never comes.
              core.warning(`Could not arm auto-merge on #${number}: ${e.message}`);
              await settle(
                "failure", `Backport PR #${number} open, merge it by hand`
              );
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body:
                    `**Auto-merge could not be armed on this PR** (${e.message}). ` +
                    `Everything else holds — the cherry-pick is clean and the ` +
                    `checks are running — but approving will not merge it on its ` +
                    `own. Merge it by hand once the checks are green.`,
                });
              } catch (commentError) {
                core.warning(
                  `Could not correct the auto-merge claim on #${number}: ${commentError.message}`
                );
              }
            }

