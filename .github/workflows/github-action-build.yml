name: Build

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  push:
    branches:
      - 'ci-enable/**'
      - 'main'
      - 'release/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    outputs:
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
      run_scala: ${{ steps.decide.outputs.run_scala }}
      run_python: ${{ steps.decide.outputs.run_python }}
      run_agent_service: ${{ steps.decide.outputs.run_agent_service }}
      backport_targets: ${{ steps.decide.outputs.backport_targets }}
    steps:
      - name: Decide which jobs to run
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const eventName = context.eventName;
            const action = context.payload.action || "";
            const isLabelOnlyEvent =
              eventName === "pull_request" && (action === "labeled" || action === "unlabeled");

            // Main build stacks. Default: run all. Skip on label-only PR
            // events because the code did not change.
            const stacks = {
              run_frontend: !isLabelOnlyEvent,
              run_scala: !isLabelOnlyEvent,
              run_python: !isLabelOnlyEvent,
              run_agent_service: !isLabelOnlyEvent,
            };
            for (const [key, value] of Object.entries(stacks)) {
              core.info(`${key}=${value}`);
              core.setOutput(key, value ? "true" : "false");
            }

            // Backport targets. Only on PR events.
            let targets = [];
            if (eventName === "pull_request") {
              if (action === "labeled") {
                const newLabel = context.payload.label && context.payload.label.name;
                if (newLabel && /^release\/.+$/.test(newLabel)) {
                  targets = [newLabel];
                }
              } else if (action !== "unlabeled") {
                const labels = context.payload.pull_request.labels.map((l) => l.name);
                targets = [...new Set(labels.filter((n) => /^release\/.+$/.test(n)))].sort();
              }
            }

            if (targets.length === 0) {
              core.info(`No backport targets for event=${eventName} action=${action || "(none)"}.`);
            } else {
              core.info(`Backport targets: ${targets.join(", ")}`);
            }
            core.setOutput("backport_targets", JSON.stringify(targets));

  frontend:
    needs: precheck
    if: ${{ needs.precheck.outputs.run_frontend == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
        node-version:
          - 20.19.0
    steps:
      - name: Checkout Texera
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.arch }}
      - uses: actions/cache@v4
        with:
          path: frontend/.yarn/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.node-version }}-yarn-cache-v4-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.node-version }}-yarn-cache-v4-
      - name: Prepare Yarn 4.14.1
        run: corepack enable && corepack prepare yarn@4.14.1 --activate
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependency
        timeout-minutes: 20
        run: yarn --cwd frontend install --immutable --inline-builds --network-timeout=100000
      - name: Lint with Prettier & ESLint
        run: yarn --cwd frontend format:ci
      - name: Run frontend unit tests
        run: yarn --cwd frontend run test:ci
      - name: Prod build
        run: yarn --cwd frontend run build:ci

  scala:
    needs: precheck
    if: ${{ needs.precheck.outputs.run_scala == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java-version: [11]
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Setup Python for Scala tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Show Python
        run: python --version || python3 --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f amber/requirements.txt ]; then pip install -r amber/requirements.txt; fi
          if [ -f amber/operator-requirements.txt ]; then pip install -r amber/operator-requirements.txt; fi
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@508b753e53cb6095967669e0911487d2b9bc9f41 # v1.1.22
      - uses: coursier/cache-action@90c37294538be80a558fd665531fcdc2b467b475 # v8.1.0
        with:
          extraSbtFiles: '["*.sbt", "project/**.{scala,sbt}", "project/build.properties" ]'
      - name: Lint with scalafmt
        run: sbt scalafmtCheckAll
      - name: Create Databases
        run: |
          psql -h localhost -U postgres -f sql/texera_ddl.sql
          psql -h localhost -U postgres -f sql/iceberg_postgres_catalog.sql
          psql -h localhost -U postgres -f sql/texera_lakefs.sql
        env:
          PGPASSWORD: postgres
      - name: Create texera_db_for_test_cases
        run: psql -h localhost -U postgres -v DB_NAME=texera_db_for_test_cases -f sql/texera_ddl.sql
        env:
          PGPASSWORD: postgres
      - name: Compile with sbt
        run: sbt clean package
      - name: Lint with scalafix
        run: sbt "scalafixAll --check"
      - name: Set docker-java API version
        run: |
          echo "api.version=1.52" >> ~/.docker-java.properties
          cat ~/.docker-java.properties
      - name: Run backend tests
        run: sbt test

  python:
    needs: precheck
    if: ${{ needs.precheck.outputs.run_python == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Texera
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f amber/requirements.txt ]; then pip install -r amber/requirements.txt; fi
          if [ -f amber/operator-requirements.txt ]; then pip install -r amber/operator-requirements.txt; fi
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Start PostgreSQL Service
        run: sudo systemctl start postgresql
      - name: Create Database and User
        run: |
          cd sql && sudo -u postgres psql -f iceberg_postgres_catalog.sql
      - name: Lint with Ruff
        run: |
          cd amber/src/main/python && ruff check . && ruff format --check .
      - name: Test with pytest
        run: |
          cd amber/src/main/python && pytest -sv

  agent-service:
    needs: precheck
    if: ${{ needs.precheck.outputs.run_agent_service == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun-version: ['1.3.3']
    defaults:
      run:
        working-directory: agent-service
    steps:
      - name: Checkout Texera
        uses: actions/checkout@v5
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- bun-v${{ matrix.bun-version }}
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint with Prettier
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Run unit tests
        run: bun test

  backport:
    needs: precheck
    if: ${{ needs.precheck.outputs.backport_targets != '[]' }}
    name: Backport ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.precheck.outputs.backport_targets) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      backport_target_branch: ${{ matrix.target }}
      backport_commit_range: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
      job_name_suffix: ""
      run_frontend: true
      run_scala: true
      run_python: true
      run_agent_service: true
    secrets: inherit
