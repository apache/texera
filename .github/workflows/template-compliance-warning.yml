# Post a non-blocking warning when a pull request (or issue) is opened
# without following our template, and clear it automatically once the
# author fixes the description.
#
# Designed to be cheap on CI:
#   * Single `github-script` job, no build, no full checkout (only a
#     sparse-checkout of the one message .txt file), so a run is a few
#     seconds of an ubuntu-latest runner.
#   * Triggers only on `opened` / `edited`, never on `synchronize`, so
#     it does NOT run on every push to a PR branch.
#   * Skips drafts and bots, so WIP and automation don't get nagged.
#   * Posts a single sticky comment (idempotency marker) that is
#     UPDATED in place while the template is incomplete and DELETED once
#     it is followed, so it never piles up duplicate comments.
#
# Issue templates here are GitHub form (`.yaml`) templates whose
# required fields are already enforced at submission time, so for issues
# this only catches a fully blank body (e.g. a blank issue). PR
# templates cannot be enforced by GitHub, which is the main case this
# covers.
#
# Uses `pull_request_target` so PRs from forks are still checked.
# A `pull_request` run from a fork gets a read-only token and could not
# comment.
name: Template compliance warning
on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-template:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Check out only the warning message template. `pull_request_target`
      # and `issues` both resolve to the trusted base branch (never the
      # fork head), so reading this file is safe. Keeping the wording in a
      # .txt file means editing the message does not touch workflow logic.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/template-compliance-warning.txt
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPR = context.eventName === 'pull_request_target';
            const subject = isPR
              ? context.payload.pull_request
              : context.payload.issue;

            // Drafts are work-in-progress; don't nag until they're ready.
            if (isPR && subject.draft) {
              core.info(`#${subject.number} is a draft; skipping.`);
              return;
            }

            const author = subject.user.login;
            const issue_number = subject.number;
            const kind = isPR ? 'pull request' : 'issue';
            const { owner, repo } = context.repo;
            const body = subject.body || '';

            // Strip HTML comments (the template's <!-- ... --> guidance)
            // before judging whether a section actually has content.
            const stripped = body.replace(/<!--[\s\S]*?-->/g, '');

            // Build the list of problems with the description. Each entry
            // is a user-facing bullet. An empty list means "compliant".
            const problems = [];

            if (stripped.trim().length === 0) {
              problems.push(
                `The description is empty. Please open the ${kind} using ` +
                  `the provided template and fill it out.`,
              );
            } else if (isPR) {
              // PR template required sections (headings copied verbatim
              // from .github/PULL_REQUEST_TEMPLATE). For each, capture the
              // text from its heading to the next "### " heading (or end)
              // and treat whitespace-only as not filled in.
              const REQUIRED_SECTIONS = [
                'What changes were proposed in this PR?',
                'How was this PR tested?',
                'Was this PR authored or co-authored using generative AI tooling?',
              ];
              for (const heading of REQUIRED_SECTIONS) {
                // Escape regex metacharacters in the heading text.
                const esc = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                // The trailing `(?![\s\S])` is the end-of-string case (JS
                // regex has no `\Z`); with the `m` flag a bare `$` would
                // match every line end, not just the end of the body.
                const re = new RegExp(
                  `^#{1,6}\\s*${esc}\\s*$([\\s\\S]*?)(?=^#{1,6}\\s|(?![\\s\\S]))`,
                  'm',
                );
                const m = stripped.match(re);
                if (!m) {
                  problems.push(
                    `The **${heading}** section is missing; please keep ` +
                      `the template's headings.`,
                  );
                } else if (m[1].trim().length === 0) {
                  problems.push(
                    `The **${heading}** section is empty; please fill it in.`,
                  );
                }
              }
            }

            const MARKER = '<!-- texera:template-compliance -->';

            // Find a previous warning comment from this workflow.
            let existing = null;
            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              );
              existing = comments.find((c) => (c.body || '').includes(MARKER));
            } catch (e) {
              core.warning(`listComments on #${issue_number} failed: ${e.message}`);
              // Without the comment list we can't safely de-dupe; bail to
              // avoid posting a duplicate warning.
              return;
            }

            // Compliant now: remove any stale warning and stop.
            if (problems.length === 0) {
              core.info(`#${issue_number} follows the template.`);
              if (existing) {
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: existing.id,
                  });
                  core.info(`Cleared resolved warning on #${issue_number}.`);
                } catch (e) {
                  core.warning(`Failed to delete warning: ${e.message}`);
                }
              }
              return;
            }

            // Not compliant: render the message and post/update the sticky
            // comment.
            const fs = require('fs');
            const template = fs.readFileSync(
              '.github/template-compliance-warning.txt', 'utf8',
            );
            const details = problems.map((p) => `- ${p}`).join('\n');
            const message = MARKER + '\n' + template
              .replaceAll('{{author}}', author)
              .replaceAll('{{owner}}', owner)
              .replaceAll('{{repo}}', repo)
              .replaceAll('{{kind}}', kind)
              .replaceAll('{{details}}', details);

            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: message,
                });
                core.info(`Updated template warning on #${issue_number}.`);
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body: message,
                });
                core.info(`Posted template warning on #${issue_number}.`);
              }
            } catch (e) {
              core.warning(`Failed to post warning on #${issue_number}: ${e.message}`);
            }
