# Active release branches and their release managers. This file is the single
# source of truth for the backport automation. Listing a branch here:
#   - auto-labels new `fix:` PRs with the branch's `release/*` label
#     (.github/workflows/backport-auto-label.yml), so backports are opt-out
#     rather than easy-to-forget opt-in;
#   - requests review from the branch's release manager on those PRs;
#   - blocks the merge until that manager has approved the PR, or removed the
#     label to decline (.github/workflows/backport-approval-check.yml, the
#     required `Backport Approvals` check — see `manager` below);
#   - drives the post-merge backport (.github/workflows/direct-backport-push.yml):
#     a green pre-merge backport check cherry-picks straight to the branch, a
#     red one opens a draft backport PR assigned to the author with the manager
#     as reviewer.
#
# The label name equals the branch name (e.g. branch `release/v1.2` <-> label
# `release/v1.2`).
#
# `actively-supporting` controls the default: only actively-supporting branches
# are auto-labeled on new `fix:` PRs, and only they get their manager's review
# requested. An inactive branch stays a valid backport target — a maintainer can
# add its label by hand, and the apply-check and post-merge backport run — but
# its manager must still approve before the PR can merge, and nothing asks them
# to: no review is requested for an inactive branch, so whoever adds the label
# should ping the manager themselves. Omitting the field defaults to true. When
# a branch reaches end-of-life, drop its entry entirely.
#
# `manager` is a GitHub username, and it is that branch's approval gate: the
# `release/*` label only *nominates* a target, and the fix is backported there
# only once the manager has approved the PR. A manager who wrote the fix counts
# as having approved it, since GitHub does not let anyone approve their own PR.
#
# Because that approval is required to merge, declining a backport is an action
# rather than silence: the manager removes their branch's label. So the labels
# left on a merged PR are exactly the branches it was backported to, and reading
# them later tells the truth. The author's part is to ask the manager for that
# call, not to make it for them — though editing labels needs triage access, so
# any committer can remove a label on a manager's behalf.
#
# Managers gate their own branch and nothing else, so each decides alone — but
# the merge waits for all of them, so a fix cannot land on v1.2 while v1.3 is
# still undecided. With both labeled, the merge is blocked until the v1.2 and
# v1.3 managers have each either approved or removed their own label, and the
# fix then goes to exactly the branches whose labels are left.
#
# `manager` may be omitted, which leaves the branch ungated — no auto-requested
# reviewer and no approval required — but setting one is strongly recommended.
# A `release/*` label naming a branch that is not listed here at all is not
# ungated: it is held back, since nobody is designated to approve it.
targets:
  - branch: release/v1.3
    manager: mengw15
    actively-supporting: true
  - branch: release/v1.2
    manager: xuang7
    actively-supporting: true
  - branch: release/v1.1
    manager: bobbai00
    actively-supporting: false
