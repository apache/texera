# Provenance of every image and media file in the repository.
#
# Binary files cannot carry a license header, so this manifest records where
# each one came from. Every entry has:
#
#   path     repository-relative path
#   origin   project-made  created by Texera contributors for the project
#            third-party   taken from an external source; `source` and
#                          `license` say where from and under what terms, and
#                          the file must be listed in LICENSE (and in
#                          frontend/LICENSE-binary when shipped in the frontend)
#            unknown       not yet established; see #8984
#   source   where a third-party file came from (third-party only)
#   license  SPDX identifier or other terms (third-party only)
#   notes    evidence for the entry, or what still has to happen
#
# Add an entry whenever you add an image or media file.

