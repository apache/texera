[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texera-support"
version = "0.1.0.dev0"
description = "The helpers a Python script exported from a Texera workflow calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "python-dateutil",
    "tzlocal",
]

[tool.setuptools]
packages = ["texera_support"]
