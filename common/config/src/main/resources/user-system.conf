# See PR https://github.com/Texera/texera/pull/3326 for configuration guidelines.
user-sys {
  admin-username = "texera"
  admin-username = ${?USER_SYS_ADMIN_USERNAME}

  admin-password = "texera"
  admin-password = ${?USER_SYS_ADMIN_PASSWORD}

  google {
    clientId = ""
    clientId = ${?USER_SYS_GOOGLE_CLIENT_ID}

    smtp {
      gmail = ""
      gmail = ${?USER_SYS_GOOGLE_SMTP_GMAIL}

      password = ""
      password = ${?USER_SYS_GOOGLE_SMTP_PASSWORD}
    }
  }

  apple {
    clientId = ""
    clientId = ${?USER_SYS_APPLE_CLIENT_ID}
  }

  domain = ""
  domain = ${?USER_SYS_DOMAIN}

  project-name = "Texera"
  project-name = ${?USER_SYS_PROJECT_NAME}

  invite-only = false
  invite-only = ${?USER_SYS_INVITE_ONLY}

  # Whether an address the user typed must be proved by a code mailed to it before it is accepted —
  # at registration, and when an account with no address on file supplies one. An address a provider
  # asserts as verified (Google's `email_verified`) is trusted and never re-checked.
  #
  # Off by default. This default is the local-developer setting: a checkout with no SMTP sender
  # behind it should come up working, and a deployment that wants verification overrides it with
  # USER_SYS_EMAIL_VERIFICATION.
  #
  # This and google.smtp.gmail above have to agree. On with no sender configured is a
  # misconfiguration, not a degraded mode: the code cannot be sent, so registration and the
  # add-address prompt both refuse with a 503 naming the two settings.
  email-verification = false
  email-verification = ${?USER_SYS_EMAIL_VERIFICATION}

  version-time-limit-in-minutes = 60
  version-time-limit-in-minutes = ${?USER_SYS_VERSION_TIME_LIMIT_IN_MINUTES}
}