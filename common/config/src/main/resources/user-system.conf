# See PR https://github.com/Texera/texera/pull/3326 for configuration guidelines.
user-sys {
  admin-username = "texera"
  admin-username = ${?USER_SYS_ADMIN_USERNAME}

  admin-password = "texera"
  admin-password = ${?USER_SYS_ADMIN_PASSWORD}

  google {
    clientId = ""
    clientId = ${?USER_SYS_GOOGLE_CLIENT_ID}

    smtp {
      gmail = ""
      gmail = ${?USER_SYS_GOOGLE_SMTP_GMAIL}

      password = ""
      password = ${?USER_SYS_GOOGLE_SMTP_PASSWORD}
    }
  }

  orcid {
    clientId = ""
    clientId = ${?USER_SYS_ORCID_CLIENT_ID}

    clientSecret = ""
    clientSecret = ${?USER_SYS_ORCID_CLIENT_SECRET}

    baseUrl = "https://sandbox.orcid.org"
    baseUrl = ${?USER_SYS_ORCID_BASE_URL}

    # Must be byte-identical to the redirect_uri the login page sends to ORCID
    # (`${window.location.origin}/callback/orcid`) and to a redirect URI registered on the ORCID
    # client, or the token exchange is rejected. Defaults to the `ng serve` origin.
    redirectUri = "http://127.0.0.1:4200/callback/orcid"
    redirectUri = ${?USER_SYS_ORCID_REDIRECT_URI}
  }

  domain = ""
  domain = ${?USER_SYS_DOMAIN}

  project-name = "Texera"
  project-name = ${?USER_SYS_PROJECT_NAME}

  invite-only = false
  invite-only = ${?USER_SYS_INVITE_ONLY}

  version-time-limit-in-minutes = 60
  version-time-limit-in-minutes = ${?USER_SYS_VERSION_TIME_LIMIT_IN_MINUTES}
}