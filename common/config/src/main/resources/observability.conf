# OpenTelemetry SDK bootstrap settings, consumed by OtelInit. Each value has a
# safe default and an optional environment override, so an operator can find and
# tune every knob here instead of in code.
observability {
    # Master switch. Disabled by default: no exporters start and no telemetry is
    # emitted until this is set to false (i.e. OTEL_SDK_DISABLED=false).
    sdk-disabled = "true"
    sdk-disabled = ${?OTEL_SDK_DISABLED}

    # OTLP collector endpoint. http/https only; loopback-only host allowlist by
    # default (extend via allowed-hosts below).
    endpoint = "http://127.0.0.1:4317"
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}

    # Comma-separated resource attributes (k1=v1,k2=v2). service.name is set by
    # the service and cannot be overridden here.
    resource-attributes = ""
    resource-attributes = ${?OTEL_RESOURCE_ATTRIBUTES}

    # Comma-separated extra hosts added to the endpoint allowlist.
    allowed-hosts = ""
    allowed-hosts = ${?TEXERA_OTEL_ALLOWED_HOSTS}

    # Metric export interval in milliseconds; out-of-range values fall back to
    # the default.
    metric-export-interval-ms = "30000"
    metric-export-interval-ms = ${?OTEL_METRIC_EXPORT_INTERVAL}
}
