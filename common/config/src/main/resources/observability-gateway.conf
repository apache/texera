# Observability query-gateway configuration.
#
# These are the *query* endpoints the dashboard's backend gateway calls to
# read logs, metrics, traces, and profiles. They are distinct from the OTLP
# *export* endpoint (OTEL_EXPORTER_OTLP_ENDPOINT) that services push to.
#
# Defaults target a host-local stack: the single-node docker-compose publishes
# every backend to 127.0.0.1, so a natively-run backend (sbt / nvim) reaches
# them with zero extra configuration — enable the backends and it just works.
# We use the literal 127.0.0.1 rather than "localhost" on purpose: on a
# dual-stack host "localhost" resolves to ::1 (IPv6) first, but docker publishes
# these ports on 127.0.0.1 (IPv4) only, and the gateway's Java HttpClient does
# not fall back ::1 -> 127.0.0.1 — so "localhost" would report every backend
# unreachable. Inside docker-compose the web service overrides each URL through
# the TEXERA_OBS_*_URL entries in bin/single-node/.env so the gateway resolves
# the bridge-network service names instead.
observability-gateway {
  # VictoriaLogs LogsQL query API.
  logs-url = "http://127.0.0.1:9428"
  logs-url = ${?TEXERA_OBS_LOGS_URL}

  # VictoriaMetrics MetricsQL query API.
  metrics-url = "http://127.0.0.1:8428"
  metrics-url = ${?TEXERA_OBS_METRICS_URL}

  # Jaeger query API.
  traces-url = "http://127.0.0.1:16686"
  traces-url = ${?TEXERA_OBS_TRACES_URL}

  # Parca pprof query API (gRPC-Web).
  profiles-url = "http://127.0.0.1:7070"
  profiles-url = ${?TEXERA_OBS_PROFILES_URL}
}
