kubernetes {

  enabled = false
  enabled = ${?KUBERNETES_COMPUTING_UNIT_ENABLED}

  compute-unit-pool-name = "texera-workflow-computing-unit"
  compute-unit-pool-name = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAME}

  compute-unit-pool-namespace = "texera-workflow-computing-unit-pool"
  compute-unit-pool-namespace = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE}

  compute-unit-service-name = "workflow-computing-unit-svc"
  compute-unit-service-name = ${?KUBERNETES_COMPUTE_UNIT_SERVICE_NAME}

  # Computing-unit pods are named "<prefix>-<cuid>". The mounter derives a CU's id back
  # out of the pod name, so both must be given the same value by the helm chart.
  compute-unit-pod-name-prefix = "computing-unit"
  compute-unit-pod-name-prefix = ${?KUBERNETES_COMPUTE_UNIT_POD_NAME_PREFIX}

  image-name = "bobbai/texera-workflow-computing-unit:dev"
  image-name = ${?KUBERNETES_IMAGE_NAME}

  image-pull-policy = "Always"
  image-pull-policy = ${?KUBERNETES_IMAGE_PULL_POLICY}

  port-num = 8085

  # Configuration on how many computing units one user can create
  max-num-of-running-computing-units-per-user = 10
  max-num-of-running-computing-units-per-user = ${?MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  computing-unit-cpu-limit-options = "1,2,4"
  computing-unit-cpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "1Gi,2Gi,4Gi"
  computing-unit-memory-limit-options = ${?KUBERNETES_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # GPU configuration
  computing-unit-gpu-limit-options = "0,1,2"
  computing-unit-gpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}
  
  # GPU resource key used in Kubernetes (vendor-specific)
  computing-unit-gpu-resource-key = "nvidia.com/gpu"
  computing-unit-gpu-resource-key = ${?KUBERNETES_COMPUTING_UNIT_GPU_RESOURCE_KEY}

  # Per-user JupyterLab pods. Separate from `enabled` above, so a deployment can run
  # computing units on Kubernetes without per-user Jupyter. While this is off, the
  # notebook migration service uses the single Jupyter from storage.jupyter.
  jupyter-enabled = false
  jupyter-enabled = ${?KUBERNETES_JUPYTER_ENABLED}

  jupyter-namespace = "texera-jupyter-pool"
  jupyter-namespace = ${?KUBERNETES_JUPYTER_NAMESPACE}

  jupyter-service-name = "jupyter-svc"
  jupyter-service-name = ${?KUBERNETES_JUPYTER_SERVICE_NAME}

  jupyter-image-name = "ghcr.io/apache/texera-jupyter:latest"
  jupyter-image-name = ${?KUBERNETES_JUPYTER_IMAGE_NAME}

  jupyter-port-num = 8888

  # Origin the pod names in its iframe CSP and its postMessage checks. The image defaults
  # to the local dev origin when this is empty, which suits no real deployment.
  jupyter-texera-origin = ""
  jupyter-texera-origin = ${?KUBERNETES_JUPYTER_TEXERA_ORIGIN}

  jupyter-cpu-limit = "1"
  jupyter-cpu-limit = ${?KUBERNETES_JUPYTER_CPU_LIMIT}

  jupyter-memory-limit = "2Gi"
  jupyter-memory-limit = ${?KUBERNETES_JUPYTER_MEMORY_LIMIT}

  # Browser-facing address, with {uid} substituted. The in-network pod name does not
  # resolve from the browser, so a deployment that publishes Jupyter sets this; empty
  # falls back to the in-network address.
  jupyter-public-url-template = ""
  jupyter-public-url-template = ${?KUBERNETES_JUPYTER_PUBLIC_URL_TEMPLATE}

  # Per-node mounter (out-of-pod FUSE mounting). Off unless the deployment opted in:
  # the mount gives each CU pod a hostPath volume, which the `baseline` and `restricted`
  # Pod Security Standards forbid, so a cluster enforcing either would reject every CU pod.
  mounter-enabled = false
  mounter-enabled = ${?KUBERNETES_MOUNTER_ENABLED}

  # Must match the texera-mounter DaemonSet's hostPath in the helm chart: the CU pod's
  # hostPath volume is the <root>/<cuid> subtree the mounter mounts into.
  mounter-host-root = "/var/lib/texera-mounts"
  mounter-host-root = ${?KUBERNETES_MOUNTER_HOST_ROOT}
}