server:
  applicationContextPath: /
  applicationConnectors:
    - type: http
      port: 8085

  # Disable the admin connectors if you don't need an admin interface
  adminConnectors: []

  # Optional: Minimize the request log configuration if not handling HTTP requests
  requestLog:
    type: classic
    timeZone: UTC
    appenders: []

logging:
  level: ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
  loggers:
    "io.dropwizard": ${TEXERA_SERVICE_LOG_LEVEL:-INFO}
    # Cap noisy frameworks at WARN so TRACE/DEBUG surfaces Texera code
    # (org.apache.texera) without the framework firehose.
    "org.apache.pekko": WARN
    "org.apache.iceberg": WARN
    "org.apache.hadoop": WARN
    "org.apache.kafka": WARN
    "org.eclipse.jetty": WARN
    "org.glassfish.jersey": WARN
    "io.grpc": WARN
    "io.netty": WARN
    "com.zaxxer.hikari": WARN
    "software.amazon.awssdk": WARN
  appenders:
    - type: console
      logFormat: "[%date{ISO8601}] [%level] [%logger] [%thread] - %msg %n"
    - type: file
      currentLogFilename: logs/computing-unit-master.log
      threshold: ALL
      queueSize: 512
      discardingThreshold: 0
      archive: false
      timeZone: UTC
      logFormat: "[%date{ISO8601}] [%level] [%logger] [%thread] - %msg %n"
      bufferSize: 8KiB
      immediateFlush: true
