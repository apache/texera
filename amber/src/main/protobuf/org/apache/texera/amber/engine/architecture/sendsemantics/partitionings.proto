syntax = "proto3";

package org.apache.texera.amber.engine.architecture.sendsemantics;

import "org/apache/texera/amber/core/virtualidentity.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE,
  preserve_unknown_fields: false
  no_default_values_in_constructor: true
};

message Partitioning{
  oneof sealed_value{
    OneToOnePartitioning oneToOnePartitioning = 1;
    RoundRobinPartitioning roundRobinPartitioning = 2;
    HashBasedShufflePartitioning hashBasedShufflePartitioning = 3;
    RangeBasedShufflePartitioning rangeBasedShufflePartitioning = 4;
    BroadcastPartitioning broadcastPartitioning = 5;
    LeastLoadedPartitioning leastLoadedPartitioning = 6;
  }
}

message OneToOnePartitioning{
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
}

message RoundRobinPartitioning{
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
}

message HashBasedShufflePartitioning{
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
  repeated string hashAttributeNames = 3;
}

message RangeBasedShufflePartitioning {
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
  repeated string rangeAttributeNames = 3;
  int64 rangeMin = 4;
  int64 rangeMax = 5;
}

message BroadcastPartitioning{
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
}

// Like round robin in that any receiver may take any tuple, but the sender
// fills one batch at a time and the coordinator picks that batch's receiver
// from measured backlog (see LeastLoadedRoutingService). Round robin instead
// holds one batch per receiver, so a link needs senders x receivers x batchSize
// tuples before the first batch ships -- which leaves downstream workers idle
// on a fan-out whose per-worker output is small relative to that product.
//
// Carries no preferred receiver: the preference is runtime state that changes
// every poll, delivered by UpdateRoutingPreference, not part of the link's
// configuration.
message LeastLoadedPartitioning{
  int32 batchSize = 1;
  repeated core.ChannelIdentity channels = 2;
}
